name: Proposal
description: 在实现前讨论功能、行为或权限变化
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁遇到什么问题？为什么现有工作流不能解决？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 建议方向与范围
      description: 预期行为、最小改动、明确不做什么，以及替代方案。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 风险与验证
      description: 是否改变默认值、权限、证据、持久化或发布？如何验证？
    validations:
      required: true
  - type: markdown
    attributes:
      value: 提交提案不代表获批；请等待维护者对方向和范围的明确决定，并在 PR 链接批准评论。
