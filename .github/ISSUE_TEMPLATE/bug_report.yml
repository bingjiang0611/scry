name: Bug report
description: 报告可复现的 Scry 问题
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。不要提交凭据、原始会话、用户数据库或私人性能记录。
        安全漏洞不要公开利用细节；先请求维护者提供私有报告渠道。
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: |
        Scry 版本、操作系统版本、CPU 架构、相关 Provider / CLI 版本，以及安装或运行方式（源码开发、解包目录、安装包格式与版本）。
        Linux 请写发行版及版本；UI/桌面问题再补桌面环境或窗口管理器及版本、Wayland/X11。容器、虚拟机、Xvfb 或 headless wlroots 请明确标注。
        敏感路径请脱敏；不要粘贴完整环境变量或密钥环内容。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从什么状态开始，做了什么；是否稳定复现？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证与证据
      description: 脱敏截图、日志片段、已尝试的检查和未验证项。跨平台结果分开记录；构建或包检查不等于目标桌面验收。不要以推测代替结果。
