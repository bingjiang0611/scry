name: Cache Electron downloads
description: Cache only the checked Electron release downloads, not installed modules or builds
inputs:
  lockfiles:
    description: Lockfiles for the one or two source revisions built by this job
    default: package-lock.json
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      env:
        LOCKFILES: ${{ inputs.lockfiles }}
      run: |
        node <<'JS'
        const fs = require('node:fs')
        const path = require('node:path')
        const versions = [...new Set(process.env.LOCKFILES.trim().split(/\s+/).map(file => {
          const lock = JSON.parse(fs.readFileSync(file, 'utf8'))
          return lock.packages['node_modules/electron'].version
        }))].sort()
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `versions=${versions.join('+')}\n`)
        // Electron's installer passes this cacheRoot to @electron/get, which
        // still validates the cached ZIP against its official SHA256 manifest.
        const cache = path.join(process.env.RUNNER_TEMP, 'electron-downloads')
        fs.appendFileSync(process.env.GITHUB_ENV, `electron_config_cache=${cache}\n`)
        JS
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/electron-downloads
        key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.versions }}
