name: Performance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit or ref (same frozen harness on both sources)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QODER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install each source's dependencies
        run: |
          set -o pipefail
          mkdir -p performance-results
          printf '%s\n' 'Dependency installation started; absent measurements are not a pass.' > performance-results/install-status.txt
          cp candidate/.npmrc baseline/.npmrc
          (cd baseline && npm ci --ignore-scripts) 2>&1 | tee performance-results/baseline-install.log
          (cd candidate && npm ci --ignore-scripts) 2>&1 | tee performance-results/candidate-install.log
      - name: Check coverage map and feedback contracts
        working-directory: candidate
        run: |
          mkdir -p ../performance-results
          node scripts/performance-report.mjs inventory > ../performance-results/inventory.json
          cp scripts/performance-budgets.json scripts/performance-paths.json ../performance-results/
          npm run test:unit -- scripts/performance-feedback.test.ts scripts/performance-native.test.ts src/main/performance-journal.test.ts src/main/performance-timing.test.ts src/main/ipc-trust.test.ts
      - name: Freeze candidate harness for both source revisions
        run: |
          cp candidate/scripts/performance-baseline.test.ts baseline/scripts/
          cp candidate/scripts/performance-bench.mjs baseline/scripts/
          cp candidate/vitest.config.ts baseline/vitest.config.ts
          cp candidate/src/main/providers/fixtures/codex-app-server.mjs baseline/src/main/providers/fixtures/codex-app-server.mjs
      - name: Measure baseline then candidate on the same runner (never parallel)
        run: |
          mkdir -p performance-results
          (cd baseline && node scripts/performance-bench.mjs ../performance-results/baseline.json)
          (cd candidate && node scripts/performance-bench.mjs ../performance-results/candidate.json)
      - name: Compare fixed budgets and base-relative regressions
        run: |
          node candidate/scripts/performance-compare.mjs performance-results/baseline.json performance-results/candidate.json candidate/scripts/performance-budgets.json performance-results/report.md
      - name: Preserve npm diagnostics on installation failure
        if: failure()
        run: |
          mkdir -p performance-results
          if [ -d "$HOME/.npm/_logs" ]; then cp -R "$HOME/.npm/_logs" performance-results/npm-logs; fi
      - name: Retain measurements even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results/
          if-no-files-found: error
          retention-days: 30

  native:
    # Same frozen driver, two real source builds, one runner, serial measurements.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QODER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install dependencies and freeze native harness
        run: |
          set -o pipefail
          mkdir -p native-results
          printf '%s\n' 'Dependency installation started; absent measurements are not a pass.' > native-results/install-status.txt
          cp candidate/.npmrc baseline/.npmrc
          (cd baseline && npm ci) 2>&1 | tee native-results/baseline-install.log
          (cd candidate && npm ci) 2>&1 | tee native-results/candidate-install.log
          for file in $(node --input-type=module -e "import { nativeHarnessFiles } from './candidate/scripts/performance-native.mjs'; console.log(nativeHarnessFiles.join(' '))"); do
            cp "candidate/$file" "baseline/$file"
          done
      - name: Prepare Electron ABI and build both source revisions
        run: |
          set -o pipefail
          (cd baseline && ./node_modules/.bin/electron-builder install-app-deps) 2>&1 | tee native-results/baseline-native-deps.log
          (cd candidate && ./node_modules/.bin/electron-builder install-app-deps) 2>&1 | tee native-results/candidate-native-deps.log
          (cd baseline && node -e "require('node:fs').accessSync(require('electron'))") 2>&1 | tee native-results/baseline-electron-ready.log
          (cd candidate && node -e "require('node:fs').accessSync(require('electron'))") 2>&1 | tee native-results/candidate-electron-ready.log
          (cd baseline && npm run build) 2>&1 | tee native-results/baseline-build.log
          (cd candidate && npm run build) 2>&1 | tee native-results/candidate-build.log
      - name: Measure baseline then candidate, retaining failures
        run: |
          status=0
          (cd baseline && node scripts/performance-native.mjs bench ../native-results/baseline.json) || status=$?
          (cd candidate && node scripts/performance-native.mjs bench ../native-results/candidate.json) || status=$?
          exit "$status"
      - name: Compare native evidence and budgets
        if: always()
        run: node candidate/scripts/performance-native.mjs compare native-results/baseline.json native-results/candidate.json native-results/report.md
      - name: Preserve native npm diagnostics on failure
        if: failure()
        run: |
          mkdir -p native-results
          if [ -d "$HOME/.npm/_logs" ]; then cp -R "$HOME/.npm/_logs" native-results/npm-logs; fi
      - name: Retain native measurements, including failed lanes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-native-results
          path: native-results/
          if-no-files-found: error
          retention-days: 30

  comment:
    # Fork PRs retain a read-only summary/artifact. Never run PR code with a write token.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [compare, native]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: performance-*
          path: reports
      - uses: actions/github-script@v7
        env:
          NODE_RESULT: ${{ needs.compare.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        with:
          script: |
            const fs = require('node:fs')
            const sections = [['Node', 'performance-results'], ['Native', 'performance-native-results']].map(([label, artifact]) => {
              const file = `reports/${artifact}/report.md`
              return fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : `## ${label}\nNo valid comparison was produced. Missing measurements are not a pass.`
            })
            const body = (`<!-- scry-performance -->\nNode job: ${process.env.NODE_RESULT} · Native job: ${process.env.NATIVE_RESULT}\n\n` + sections.join('\n\n')).slice(0, 60000)
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number }
            const comments = await github.paginate(github.rest.issues.listComments, params)
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body.startsWith('<!-- scry-performance -->'))
            if (previous) await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: previous.id, body })
            else await github.rest.issues.createComment({ ...params, body })
