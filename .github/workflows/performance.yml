# Branch-only replacement for the registered Performance workflow during the ABAB experiment.
# Do not merge this workflow definition to main: main retains the formal gate and thresholds.
name: Performance ABAB branch experiment

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Explicit baseline commit or ref to compare against the current checkout
        required: true
        type: string

permissions:
  contents: read

jobs:
  abab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QODER_SKIP_DOWNLOAD: '1'
      SCRY_ABAB_ROUNDS: '3'
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Validate baseline and create the second clean worktree
        env:
          BASELINE_INPUT: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          mkdir -p performance-results
          test -n "$BASELINE_INPUT"
          baseline_sha=$(git -C candidate rev-parse --verify "$BASELINE_INPUT^{commit}")
          git -C candidate status --porcelain --untracked-files=no
          git -C candidate worktree add --detach "$GITHUB_WORKSPACE/baseline" "$baseline_sha"
          printf '%s\n' "$baseline_sha" > performance-abab-baseline-revision.txt
      - name: Install dependencies in both clean worktrees
        run: |
          set -euo pipefail
          mkdir -p performance-results
          printf '%s\n' 'Dependency installation started; missing measurements are not a pass.' > performance-results/install-status.txt
          cp candidate/.npmrc baseline/.npmrc
          (cd baseline && npm ci --ignore-scripts) 2>&1 | tee performance-results/baseline-install.log
          (cd candidate && npm ci --ignore-scripts) 2>&1 | tee performance-results/candidate-install.log
      - name: Freeze the candidate ABAB harness into baseline only
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            mkdir -p "baseline/$(dirname "$file")"
            cp "candidate/$file" "baseline/$file"
          done < <(cd candidate && node --input-type=module -e "import { performanceAbabHarnessFiles } from './scripts/performance-abab-harness.mjs'; for (const file of performanceAbabHarnessFiles) console.log(file)")
      - name: Run three serial ABAB rounds on one runner
        id: abab
        run: |
          set -o pipefail
          mkdir -p performance-results
          baseline_sha=$(cat performance-abab-baseline-revision.txt)
          candidate_sha=$(git -C candidate rev-parse HEAD)
          (cd candidate && SCRY_ABAB_BASELINE_REVISION="$baseline_sha" SCRY_ABAB_CANDIDATE_REVISION="$candidate_sha" node .agents/skills/scry-performance-climb/scripts/timing-run.mjs node-abab -- node scripts/performance-abab.mjs --baseline "$GITHUB_WORKSPACE/baseline" --candidate "$GITHUB_WORKSPACE/candidate" --output "$GITHUB_WORKSPACE/performance-results" --rounds 3 --batches 20) 2>&1 | tee performance-results/controller.log
      - name: Summarize complete rounds with the unchanged comparator
        if: always()
        run: |
          set -o pipefail
          node candidate/scripts/performance-abab-report.mjs performance-results 3 2>&1 | tee performance-results/comparison.log
      - name: Preserve all original ABAB results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-abab-results
          path: |
            performance-results/
            performance-abab-baseline-revision.txt
          if-no-files-found: error
          retention-days: 30
