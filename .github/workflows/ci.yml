name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Electron executable
        run: |
          node -e "require('node:fs').accessSync(require('electron'))"
          electron_bin="$(node -e "process.stdout.write(require('electron'))")"
          echo "Electron executable: ${electron_bin}"
          sandbox="$(dirname "${electron_bin}")/chrome-sandbox"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            sudo chown root:root "${sandbox}"
            sudo chmod 4755 "${sandbox}"
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, contract tests and coverage
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' npm run test:coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore
      - name: Workspace hook shell test
        run: npm run test:shell
      - name: Build desktop app
        run: npm run build
      - name: Build recorder CLI
        run: npm run build:cli

  cli-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: CLI tests and clean tarball smoke
        run: npm run check:cli-release

  packaged-electron:
    needs: [node, cli-compat]
    runs-on: macos-14
    timeout-minutes: 30
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Electron executable
        run: node -e "require('node:fs').accessSync(require('electron'))"
      - name: Prepare Electron native dependencies
        run: ./node_modules/.bin/electron-builder install-app-deps
      - name: Isolated renderer DOM smoke tests
        run: npm run test:renderer:ui
      - run: npm run pack:artifact

  # Linux 打包门禁：只验证产物布局、原生模块、私有 CLI、locale 裁剪与资源 allowlist。
  # GUI smoke（pack:artifact 里的 smoke:electron）需要可用的 Chromium sandbox setuid 和显示环境，
  # 本 job 不伪造这两者；界面与 Wayland 行为在目标 Omarchy 机器上验收。
  packaged-linux:
    needs: [node, cli-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Electron executable
        run: node -e "require('node:fs').accessSync(require('electron'))"
      - name: Prepare Electron native dependencies
        run: ./node_modules/.bin/electron-builder install-app-deps
      - name: Build desktop app and private CLI
        run: |
          npm run build
          npm run build:cli
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      # 发布构建同时产出 dist/linux-unpacked 和 dist/*.pacman；
      # pacman 的 pkgdesc 曾经静默变空，所以打包产物必须过 check:pacman-package。
      - name: Package Linux app directory and pacman package
        run: SCRY_RELEASE_BUILD=1 node scripts/run-electron-builder.mjs
      - name: Check packaged Linux app
        run: npm run check:packaged-app
      - name: Check pacman package metadata
        run: npm run check:pacman-package
