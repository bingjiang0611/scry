name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/validation-changes.yml

  node:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # This job compiles but never launches Electron or loads native modules.
      # A clean --ignore-scripts install covers every command below; do not
      # download an unused Electron executable or prepare its runtime sandbox.
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Harness binding checks
        run: npm run check:harness-bindings
      - name: Workspace hook shell test
        run: npm run test:shell
      - name: Build desktop app
        run: npm run build
      - name: Build recorder CLI
        run: npm run build:cli

  # 全量 Vitest 按文件分成 4 片并行。每片仍只用一个 worker，
  # 50k-trace 等 CPU 密集契约不会互相争抢，超时保持不变；不过滤任何测试。
  unit:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/cache-electron
        id: electron-cache
      - run: npm ci
      - name: Prepare Electron executable
        run: |
          node -e "require('node:fs').accessSync(require('electron'))"
          electron_bin="$(node -e "process.stdout.write(require('electron'))")"
          sandbox="$(dirname "${electron_bin}")/chrome-sandbox"
          sudo chown root:root "${sandbox}"
          sudo chmod 4755 "${sandbox}"
      # Save the validated download before unrelated tests/builds can fail.
      - uses: actions/cache/save@v4
        if: ${{ steps.electron-cache.outputs.hit != 'true' }}
        with:
          path: ${{ runner.temp }}/electron-downloads
          key: ${{ steps.electron-cache.outputs.key }}
      - name: Unit, contract tests and coverage shard
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' npm run test:coverage -- --maxWorkers=1 --shard=${{ matrix.shard }}/4 --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
      - name: Keep shard results for the merged coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  # 任一分片失败时仍合并已完成分片并上传覆盖率，便于排查；Check 仍因 unit 失败而失败。
  unit-coverage:
    needs: [changes, unit]
    if: ${{ !cancelled() && needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge shard results and coverage
        run: npx vitest run --merge-reports --coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: ignore

  cli-compat:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: CLI tests and clean tarball smoke
        # Full desktop typechecking runs in node; CLI compilation and all runtime
        # tests/tarball checks still execute on every supported Node version.
        run: npm run check:cli-runtime

  # Preserve the serial smoke order in three contiguous slices. Packaging runs
  # with the shortest slice. Normal PRs use four macOS slots including native
  # performance; remote/iOS changes may queue one of the six jobs at the five-slot cap.
  packaged-electron:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/cache-electron
        id: electron-cache
      - run: npm ci
      - name: Prepare Electron executable
        run: node -e "require('node:fs').accessSync(require('electron'))"
      # Save the validated download before unrelated tests/builds can fail.
      - uses: actions/cache/save@v4
        if: ${{ steps.electron-cache.outputs.hit != 'true' }}
        with:
          path: ${{ runner.temp }}/electron-downloads
          key: ${{ steps.electron-cache.outputs.key }}
      - name: Prepare Electron native dependencies
        run: ./node_modules/.bin/electron-builder install-app-deps
      - name: Isolated renderer DOM smoke tests
        id: renderer-ui
        env:
          SCRY_SIDEBAR_ACTIVITY_SCREENSHOT: ${{ runner.temp }}/scry-sidebar
        run: npm run test:renderer:ui:${{ matrix.shard }}
      - name: Preserve synthetic sidebar pixel diagnostics on failure
        if: ${{ failure() && steps.renderer-ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-paint-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/scry-sidebar-*.png
          if-no-files-found: ignore
      - name: Package and smoke the macOS app
        if: ${{ matrix.shard == 2 }}
        run: npm run pack:artifact

  check:
    name: Check
    if: ${{ always() }}
    needs: [changes, node, unit, unit-coverage, cli-compat, packaged-electron, packaged-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            length == 7 and .changes.result == "success" and (
              (.changes.outputs.required == "true" and
                (del(.changes) | all(.[]; .result == "success"))) or
              (.changes.outputs.required == "false" and
                (del(.changes) | all(.[]; .result == "skipped")))
            )' > /dev/null

  # Linux 打包门禁：只验证产物布局、原生模块、私有 CLI、locale 裁剪与资源 allowlist。
  # GUI smoke（pack:artifact 里的 smoke:electron）需要可用的 Chromium sandbox setuid 和显示环境，
  # 本 job 不伪造这两者；界面与 Wayland 行为在目标 Omarchy 机器上验收。
  packaged-linux:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QODER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/cache-electron
        id: electron-cache
      - run: npm ci
      - name: Prepare Electron executable
        run: node -e "require('node:fs').accessSync(require('electron'))"
      # Save the validated download before unrelated tests/builds can fail.
      - uses: actions/cache/save@v4
        if: ${{ steps.electron-cache.outputs.hit != 'true' }}
        with:
          path: ${{ runner.temp }}/electron-downloads
          key: ${{ steps.electron-cache.outputs.key }}
      # run-electron-builder performs the authoritative forced ABI rebuild and
      # real native-load probe; no Electron tests precede it in this job.
      - name: Build desktop app and private CLI
        run: |
          npm run build
          npm run build:cli
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      # 发布构建同时产出 dist/linux-unpacked 和 dist/*.pacman；
      # pacman 的 pkgdesc 曾经静默变空，所以打包产物必须过 check:pacman-package。
      - name: Package Linux app directory and pacman package
        run: SCRY_RELEASE_BUILD=1 node scripts/run-electron-builder.mjs
      - name: Check packaged Linux app
        run: npm run check:packaged-app
      - name: Check pacman package metadata
        run: npm run check:pacman-package
