name: Remote daemon Linux acceptance

on:
  push:
    branches: [claude/remote-runtime-v2]
    paths: [.github/workflows/remote-daemon-linux-acceptance.yml]

permissions:
  contents: read

jobs:
  n1-linux-sigkill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Built daemon SIGKILL and exact Linux lease identity
        run: node scripts/daemon-sigkill-restart.mjs
