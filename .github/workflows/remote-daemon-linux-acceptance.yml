name: Remote daemon Linux acceptance

on:
  push:
    branches: [claude/remote-runtime-v2]
    paths: [.github/workflows/remote-daemon-linux-acceptance.yml]

permissions:
  contents: read

jobs:
  n1-linux-sigkill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Built daemon SIGKILL and exact Linux lease identity
        shell: bash
        run: |
          set +e
          output="$(node scripts/daemon-sigkill-restart.mjs 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            tail="$(printf '%s' "$output" | tail -c 2000 | tr '\n' ' ')"
            echo "::error title=Linux daemon acceptance failed::$tail"
          fi
          exit "$code"
