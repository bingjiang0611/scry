name: Remote daemon Linux acceptance

on:
  push:
    branches: [claude/remote-runtime-v2]
    paths:
      - .github/workflows/remote-daemon-linux-acceptance.yml
      - scripts/daemon-sigkill-restart.mjs
      - src/daemon/main.ts
      - src/daemon/signal-shutdown.ts
      - src/daemon/signal-shutdown.test.ts

permissions:
  contents: read

jobs:
  n1-linux-sigkill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Electron binary
        run: |
          node node_modules/electron/install.js
          test -x node_modules/electron/dist/electron
      - run: npm run build
      - name: Built daemon SIGKILL and exact Linux lease identity
        shell: bash
        run: |
          set +e
          export SCRY_DAEMON_SIGKILL_LOG=/tmp/scry-daemon-linux.log
          output="$(node scripts/daemon-sigkill-restart.mjs 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            tail="$( { printf '%s\n' "$output"; tail -c 3000 "$SCRY_DAEMON_SIGKILL_LOG" 2>/dev/null || true; } | tail -c 4000 | tr '\n' ' ')"
            echo "::error title=Linux daemon acceptance failed::$tail"
          fi
          exit "$code"
