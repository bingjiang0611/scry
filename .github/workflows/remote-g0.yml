name: Remote G0 local contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: remote-g0-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.diff.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Detect remote changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet --no-ext-diff --no-textconv "$BASE_SHA" HEAD -- experiments/remote-g0 apps/ios .github/workflows; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  transport:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # macos-15's default Xcode 16.4 is too old for locked swift-collections.
      # This installed path was checked against the runner image manifest.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/remote-g0/package-lock.json
      - name: Toolchain and OpenSSL 3
        run: |
          swift --version
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: npm --prefix experiments/remote-g0 ci --ignore-scripts
      # 依赖编译占 swift test 的大部分时间；按锁文件缓存 SwiftPM 构建目录，源码变化仍会增量重编。
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: experiments/remote-g0/swift/.build
          key: swiftpm-build-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('experiments/remote-g0/swift/Package.resolved') }}
      - run: node experiments/remote-g0/generate-wire.mjs --check
      - run: npm --prefix experiments/remote-g0 test
      - run: swift test --package-path experiments/remote-g0/swift -j 4
      - run: swift build --package-path experiments/remote-g0/swift -j 4
      - run: node experiments/remote-g0/smoke.mjs
      - run: node experiments/remote-g0/enrollment-smoke.mjs
      - run: node experiments/remote-g0/pair-smoke.mjs
      - run: npm --prefix experiments/remote-g0 run smoke:g1

  # 两个 iOS 工程在同一 runner 上依次编译：GitHub Free 同时最多 5 个 macOS job，
  # 拆成两个 job 会与 CI 的 renderer 分片和 Performance native 争抢而排队。
  ios:
    needs: changes
    if: ${{ needs.changes.outputs.required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      # 只缓存 SwiftPM 源码下载（约 1.5 分钟），不缓存编译产物。
      - name: Cache ScryRemoteG0 Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scry-g0-ios/SourcePackages
          key: spm-sources-scry-g0-ios-${{ hashFiles('apps/ios/ScryRemoteG0.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Compile native iOS app and tests (not a device gate)
        run: >-
          xcodebuild -project apps/ios/ScryRemoteG0.xcodeproj
          -scheme ScryRemoteG0 -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/scry-g0-ios"
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build-for-testing
      # 只缓存 SwiftPM 源码下载（约 1.5 分钟），不缓存编译产物。
      - name: Cache ScryRemote Swift package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scry-remote-ui/SourcePackages
          key: spm-sources-scry-remote-ui-${{ hashFiles('apps/ios/ScryRemote.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Compile ScryRemote product UI (design v2, unsigned)
        run: >-
          xcodebuild -project apps/ios/ScryRemote.xcodeproj
          -scheme ScryRemote -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/scry-remote-ui"
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  check:
    name: Remote Check
    if: ${{ always() }}
    needs: [changes, transport, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require remote validation or an unaffected diff
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .changes.result == "success" and (
              (.changes.outputs.required == "true" and
                ([.transport.result, .ios.result] | all(. == "success"))) or
              (.changes.outputs.required == "false" and
                ([.transport.result, .ios.result] | all(. == "skipped")))
            )' > /dev/null
