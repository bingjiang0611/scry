name: CI infrastructure recovery

on:
  workflow_run:
    workflows: [CI, Performance, Remote G0 local contracts]
    types: [completed]

# This observer can retry jobs, not modify source or publish artifacts. It must
# never checkout workflow_run.head_sha or execute a PR-supplied script/artifact.
permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: ci-infrastructure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'startup_failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Classify failures and retry infrastructure once
        uses: actions/github-script@v7
        with:
          script: |
            const { observeInfrastructure } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-infrastructure.mjs`)
            await observeInfrastructure({ github, context, core })
