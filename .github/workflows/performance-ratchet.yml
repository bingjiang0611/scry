name: Performance ratchet

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: performance-ratchet-default
  cancel-in-progress: false

jobs:
  tighten:
    # A manual dispatch from another branch is intentionally a no-op. This job only
    # executes the trusted default branch, never fork or pull-request source code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install trusted default-branch dependencies
        run: npm ci --ignore-scripts
      - name: Collect counters and check the ratchet
        run: npm run performance:measure -- --out performance-results
      - name: Propose only lower gating ceilings
        run: npm run performance:propose -- performance-results/candidate.json --write
      - name: Open a tightening pull request when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- scripts/performance-ratchet.json; then
            echo 'No gating ceiling is tightenable.'
            exit 0
          fi
          branch="automation/performance-ratchet-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/performance-ratchet.json
          git commit -m 'chore: tighten performance counter ceilings'
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title 'chore: tighten performance counter ceilings' \
            --body 'Trusted scheduled measurement found gating work-counter ceilings that can be lowered. The proposal was generated from the default branch only.'
