<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <style>
    :root { color-scheme: dark; --bg: #171717; --panel: #1c1c1c; --panel2: #232323; --fg: #e8e8e6; --dim: #989894; --accent: #78a9ff; --focus: #78a9ff; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    :root[data-theme='light'] { color-scheme: light; --bg: #f6f6f3; --panel: #fff; --panel2: #efefeb; --fg: #222220; --dim: #6b6b66; --accent: #326dca; --focus: #326dca; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
    button, select { border: 0; border-radius: 9px; background: var(--panel2); }
    button { padding: 8px 12px; }
    main { width: min(920px, 100%); margin: 0 auto; padding: 44px 28px; }
    .lab-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
    .intro { color: var(--dim); margin: 6px 0 0; font-size: 13px; }
    .options { display: flex; gap: 8px; margin: 30px 0 18px; flex-wrap: wrap; }
    .options button { color: var(--dim); background: transparent; }
    .options button[aria-pressed='true'] { color: var(--fg); background: var(--panel2); }
    .recommended { color: var(--accent); font-size: 11px; padding-left: 8px; }
    .controls { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; color: var(--dim); font-size: 12px; }
    .controls label { display: flex; align-items: center; gap: 8px; }
    select { padding: 6px 9px; }
    .stage { min-height: 290px; margin-top: 26px; display: grid; align-items: start; justify-items: center; padding: 44px 0 28px; }
    .pane { width: min(var(--width, 420px), 100%); padding: 18px 20px; background: var(--panel); border-radius: 14px; }
    .session-head { display: flex; align-items: center; justify-content: space-between; min-height: 28px; gap: 20px; }
    .session-head h2 { margin: 0; color: var(--dim); font-size: 12px; font-weight: 600; }
    .compact { display: inline-flex; align-items: baseline; gap: 10px; }
    .compact-label { display: inline-flex; gap: 5px; align-items: center; color: var(--dim); font-size: 12px; }
    .compact strong { font: 500 20px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }
    .scope { position: relative; display: inline-flex; align-items: center; }
    .scope > button { background: transparent; color: var(--dim); padding: 3px; display: inline-flex; border-radius: 5px; }
    .scope svg { width: 12px; height: 12px; }
    .tooltip { position: absolute; z-index: 2; right: 0; top: calc(100% + 7px); width: 230px; padding: 10px 12px; border-radius: 8px; color: var(--fg); background: var(--panel2); font: 12px/1.6 -apple-system, BlinkMacSystemFont, sans-serif; box-shadow: 0 8px 28px #0003; visibility: hidden; opacity: 0; pointer-events: none; }
    .scope:hover .tooltip, .scope:focus-within .tooltip { visibility: visible; opacity: 1; }
    .identity { display: flex; align-items: center; gap: 12px; min-width: 0; margin-top: 10px; }
    .key { color: var(--dim); font-size: 12px; }
    .identity .key { width: 20px; flex: 0 0 auto; }
    .id-actions { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .id-value { background: transparent; min-width: 0; padding: 3px 0; color: var(--fg); text-align: left; }
    .id-value code { font: 12px/1.5 var(--mono); }
    .id-value:hover { color: var(--accent); }
    .copy { flex: 0 0 28px; width: 28px; height: 28px; padding: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); background: transparent; }
    .copy:hover { color: var(--fg); background: var(--panel2); }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .full-id { padding: 10px 0 0 32px; }
    .full-id code { font: 11px/1.7 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
    .rows { display: grid; gap: 13px; padding-top: 12px; }
    .row { min-width: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .row .compact strong { font-size: 16px; }
    .rows .full-id { padding: 0; }
    .rationale { margin: 0 auto; max-width: 530px; }
    .rationale h2 { font-size: 14px; font-weight: 500; margin: 0 0 7px; }
    .rationale p { color: var(--dim); font-size: 13px; margin: 0; line-height: 1.8; }
    .lab-note { color: var(--dim); font-size: 11px; margin-top: 26px; }
    .notice { min-height: 24px; color: var(--accent); font-size: 12px; text-align: center; margin: 0; }
    @media (max-width: 520px) { main { padding: 26px 16px; } .lab-head { align-items: flex-start; } .intro { max-width: 240px; } .pane { padding: 16px; } .stage { min-height: 270px; padding-top: 32px; } .controls { gap: 10px; } .identity { gap: 8px; } .id-value code { font-size: 11px; } }
  </style>
</head>
<body>
  <main id="root"></main>
  <script>
    const COPY = {
      title: '会话信息 · 局部设计稿', intro: '只调整这块信息，不增加卡片层级或横线。',
      theme: { dark: '切到浅色', light: '切到深色' },
      variants: { a: 'A · 紧凑信息带', b: 'B · 对齐字段行' }, recommended: '推荐',
      variantGroup: '结构方案', state: '数据状态', width: '面板宽度',
      states: { zero: '未观测到 · 0', some: '已观测到 · 3', unavailable: '证据不可用 · —' },
      widths: { narrow: '340 px', normal: '420 px' },
      session: '会话', id: 'ID', sessionId: 'sessionId', compact: 'Compact',
      scopeLabel: '查看压缩统计范围', scope: '仅统计当前已加载记录中确认完成的压缩，不代表原生会话的全部历史。',
      unavailable: '当前无法读取压缩证据，不能将缺失数据记为 0。',
      expandId: '展开完整 sessionId', collapseId: '收起完整 sessionId', copy: '复制完整 sessionId',
      copied: '已复制完整 sessionId', copyFailed: '复制未完成，可展开 ID 后手动选择。',
      rationale: {
        a: { title: '先读次数，需要时再查看身份', body: '把 Compact 和数字放在标题行，0 也正常显示。ID 缩短为首尾片段，保留展开与复制入口。信息更紧凑，也更容易扫到压缩次数。' },
        b: { title: '保留字段名，统一右侧数值', body: '沿用当前的两行结构，将数字与 ID 右对齐。变化更小，但仍保留独立的标题和两行信息，占用高度略多。' }
      },
      note: '这是交互设计稿；ID 为示例。0 表示当前记录中未观测到压缩；证据不可用仍显示 —。'
    }
    const SAMPLE_ID = '01a10000-1111-7000-8000-00000000abcd'
    const state = { variant: 'a', evidence: 'zero', theme: 'dark', width: '420px', expanded: false }
    const copyIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 4H4v12"/></svg>'
    const infoIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>'
    document.title = COPY.title
    const count = () => state.evidence === 'unavailable' ? '—' : state.evidence === 'some' ? '3' : '0'
    const scope = () => `<span class="scope"><button type="button" aria-label="${COPY.scopeLabel}" aria-describedby="scope-tip">${infoIcon}</button><span class="tooltip" id="scope-tip" role="tooltip">${state.evidence === 'unavailable' ? COPY.unavailable : COPY.scope}</span></span>`
    const identity = () => `<div class="id-actions"><button type="button" class="id-value" id="expand-id" aria-label="${state.expanded ? COPY.collapseId : COPY.expandId}" aria-expanded="${state.expanded}" aria-controls="full-id" title="${SAMPLE_ID}"><code>${SAMPLE_ID.slice(0, 8)}…${SAMPLE_ID.slice(-8)}</code></button><button type="button" class="copy" id="copy-id" aria-label="${COPY.copy}" title="${COPY.copy}">${copyIcon}</button></div>`
    const expanded = () => `<div class="full-id" id="full-id" ${state.expanded ? '' : 'hidden'}><code>${SAMPLE_ID}</code></div>`
    function render() {
      document.documentElement.dataset.theme = state.theme
      const a = state.variant === 'a'
      document.querySelector('#root').innerHTML = `
        <header class="lab-head"><div><h1>${COPY.title}</h1><p class="intro">${COPY.intro}</p></div><button id="theme" type="button">${COPY.theme[state.theme]}</button></header>
        <nav class="options" aria-label="${COPY.variantGroup}"><button type="button" data-variant="a" aria-pressed="${a}">${COPY.variants.a}<span class="recommended">${COPY.recommended}</span></button><button type="button" data-variant="b" aria-pressed="${!a}">${COPY.variants.b}</button></nav>
        <div class="controls"><label>${COPY.state}<select id="evidence">${Object.entries(COPY.states).map(([key, label]) => `<option value="${key}" ${state.evidence === key ? 'selected' : ''}>${label}</option>`).join('')}</select></label><label>${COPY.width}<select id="width"><option value="340px" ${state.width === '340px' ? 'selected' : ''}>${COPY.widths.narrow}</option><option value="420px" ${state.width === '420px' ? 'selected' : ''}>${COPY.widths.normal}</option></select></label></div>
        <div class="stage"><section class="pane" style="--width:${state.width}" aria-label="${COPY.session}">
          ${a ? `<header class="session-head"><h2>${COPY.session}</h2><div class="compact"><span class="compact-label">${COPY.compact}${scope()}</span><strong>${count()}</strong></div></header><div class="identity"><span class="key">${COPY.id}</span>${identity()}</div>${expanded()}` : `<header class="session-head"><h2>${COPY.session}</h2></header><div class="rows"><div class="row"><span class="key">${COPY.sessionId}</span>${identity()}</div>${expanded()}<div class="row"><span class="compact-label">${COPY.compact}${scope()}</span><span class="compact"><strong>${count()}</strong></span></div></div>`}
        </section></div>
        <p class="notice" role="status"></p><section class="rationale"><h2>${COPY.rationale[state.variant].title}</h2><p>${COPY.rationale[state.variant].body}</p><p class="lab-note">${COPY.note}</p></section>`
      document.querySelectorAll('[data-variant]').forEach(button => button.onclick = () => { state.variant = button.dataset.variant; state.expanded = false; render(); document.querySelector(`[data-variant="${state.variant}"]`).focus() })
      document.querySelector('#theme').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); document.querySelector('#theme').focus() }
      document.querySelector('#evidence').onchange = event => { state.evidence = event.target.value; render(); document.querySelector('#evidence').focus() }
      document.querySelector('#width').onchange = event => { state.width = event.target.value; render(); document.querySelector('#width').focus() }
      document.querySelector('#expand-id').onclick = () => { state.expanded = !state.expanded; render(); document.querySelector('#expand-id').focus() }
      document.querySelector('#copy-id').onclick = async () => {
        try { await navigator.clipboard.writeText(SAMPLE_ID); document.querySelector('.notice').textContent = COPY.copied }
        catch { document.querySelector('.notice').textContent = COPY.copyFailed }
      }
    }
    render()
  </script>
</body>
</html>
