<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Scry · LLM token 速度 原型 v8</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Token snapshot: src/renderer/styles.css + codex-alignment.css (dark). Monochrome chart per user reference. */
:root {
  color-scheme: dark;
  --panel: #161616; --panel2: #1f1f1f; --panel3: #2a2a2a;
  --border: #2c2c2a; --border3: #232322;
  --fg: #f1f1ef; --dim: #b5b5af; --dim2: #8d8d87; --dim3: #62625e;
  --ok: #69cc93;
  --line: #f1f1ef; --line-muted: rgb(241 241 239 / 16%);
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --shadow-pop: 0 32px 88px rgb(0 0 0 / 46%), 0 10px 28px rgb(0 0 0 / 24%), inset 0 0 0 1px rgb(255 255 255 / 2.5%);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: #0a0a0a; color: var(--fg); font: 13px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }

.modal { width: min(900px, calc(100vw - 48px)); max-height: calc(100vh - 48px); display: flex; flex-direction: column;
  border: 1px solid var(--border); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow-pop); overflow: hidden; }
.head { display: flex; align-items: center; gap: 14px; padding: 22px 18px 0 28px; }
.head h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: .01em; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--dim2); font-size: 12px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--dim3); }
.live.on { color: var(--dim); }
.live.on i { background: var(--ok); box-shadow: 0 0 0 3px rgb(105 204 147 / 18%); }
.pill { margin-left: auto; display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--border); background: #121212; }
.pill button { border: 1px solid transparent; background: none; color: var(--dim2); font: inherit; font-size: 12.5px; letter-spacing: .04em;
  padding: 6px 16px; border-radius: 999px; cursor: pointer; }
.pill button:hover { color: var(--dim); }
.pill button[aria-pressed="true"] { background: var(--panel3); border-color: rgb(255 255 255 / 6%); color: var(--fg); }
.x { width: 32px; height: 32px; border: 0; border-radius: 10px; background: none; color: var(--dim2); font-size: 18px; cursor: pointer; }
.x:hover { background: rgb(255 255 255 / 6%); color: var(--fg); }
.body { overflow: auto; padding: 8px 28px 26px; display: grid; gap: 26px; }

/* Running now: hidden when idle. */
.running { display: grid; gap: 2px; margin-top: 10px; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) auto 110px; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border3); }
.run b { font-weight: 550; }
.run span { color: var(--dim2); }
.state { font-size: 11.5px; color: var(--dim2); display: inline-flex; align-items: center; gap: 6px; }
.state.gen { color: var(--ok); }
.state.gen::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.run .speed { text-align: right; }
.run .speed strong { font-size: 15px; font-weight: 600; }
.run .speed small { color: var(--dim2); margin-left: 3px; }

/* Chart */
.chart { position: relative; margin-top: 6px; }
.chart svg { display: block; width: 100%; height: 300px; overflow: visible; }
.axis text { fill: var(--dim3); font-size: 12px; }
.axis line { stroke: var(--border3); }
.line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.line.main { stroke: var(--line); stroke-width: 2.6; }
.line.other { stroke: var(--line-muted); stroke-width: 1.4; }
.cross { stroke: rgb(255 255 255 / 18%); }
.tip { position: absolute; top: 0; pointer-events: none; padding: 8px 11px; border-radius: 10px; background: #242424;
  border: 1px solid #333; font-size: 12px; white-space: nowrap; transform: translateX(-50%); min-width: 150px; }
.tip-t { color: var(--dim2); margin-bottom: 4px; }
.tip-r { display: flex; gap: 14px; line-height: 1.75; color: var(--dim2); }
.tip-r.main { color: var(--fg); }
.tip-r b { margin-left: auto; font-weight: 600; }
.empty { height: 300px; display: grid; place-items: center; color: var(--dim2); }

/* Models */
.mrow { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(220px, 2.2fr) 110px 56px; gap: 18px; align-items: center;
  width: 100%; padding: 12px 0; border: 0; border-top: 1px solid var(--border3); background: none; color: var(--dim2); font: inherit; text-align: left; cursor: pointer; }
.mrow:first-child { border-top: 0; }
.mrow:hover { color: var(--dim); }
.mrow[aria-pressed="true"] { color: var(--fg); }
.mrow b { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { position: relative; height: 14px; }
.bar .track { position: absolute; left: 0; right: 0; top: 6.5px; height: 1px; background: var(--border); }
.bar .iqr { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: rgb(241 241 239 / 10%); }
.bar .p50 { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--dim3); }
.mrow[aria-pressed="true"] .iqr { background: rgb(241 241 239 / 22%); }
.mrow[aria-pressed="true"] .p50 { background: var(--line); }
.speedv { text-align: right; }
.speedv strong { font-size: 16px; font-weight: 600; }
.speedv small { font-size: 11px; margin-left: 3px; color: var(--dim3); }
.nv { text-align: right; color: var(--dim3); }

.proto { position: fixed; left: 12px; bottom: 10px; color: var(--dim3); font-size: 11px; }
.proto a { color: var(--dim2); margin-right: 8px; }
</style>
</head>
<body>
<div class="modal" role="dialog" aria-label="LLM 性能">
  <header class="head">
    <h2>输出速度</h2>
    <span class="live" id="live"><i></i><span></span></span>
    <div class="pill" role="group" aria-label="时间范围" id="range">
      <button data-h="1">1 小时</button><button data-h="24">24 小时</button><button data-h="168">7 天</button>
    </div>
    <button class="x" aria-label="关闭">×</button>
  </header>
  <div class="body">
    <section class="running" id="running" hidden></section>
    <section class="chart" id="chart"></section>
    <section id="models"></section>
  </div>
</div>
<div class="proto">原型 · <a href="?">默认</a><a href="?state=running">运行中</a><a href="?state=empty">无数据</a></div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search)
const stateParam = params.get('state')
const sample = window.SAMPLE
const now = sample.generatedAt
const turns = stateParam === 'empty' ? [] : sample.turns.map(t => ({ ...t, tps: t.tok / (t.dur / 1000) }))
let hours = 24
let selected = null

const short = model => model.split('/').pop()
const fmt = v => v >= 100 ? Math.round(v).toString() : v.toFixed(1)
const q = (values, p) => { const s = [...values].sort((a, b) => a - b); const i = (s.length - 1) * p; const lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo) }

function render() {
  for (const b of document.querySelectorAll('#range button')) b.setAttribute('aria-pressed', String(+b.dataset.h === hours))
  const ok = turns.filter(t => !t.failed && t.t >= now - hours * 3600_000)
  // One highlighted model at a time; default to the busiest one in range.
  const byCount = [...ok.reduce((map, t) => map.set(t.model, (map.get(t.model) ?? 0) + 1), new Map())].sort((a, b) => b[1] - a[1])
  if (!byCount.some(([m]) => m === selected)) selected = byCount[0]?.[0] ?? null
  renderRunning()
  renderChart(ok)
  renderModels(ok)
}

function renderRunning() {
  const live = document.getElementById('live')
  const box = document.getElementById('running')
  const runs = stateParam === 'running' ? [
    { model: 'openai-codex/gpt-6.1-sol', project: 'scry', state: '生成中', gen: true, tps: 23.4 },
    { model: 'cc-switch/claude-opus-5-5', project: 'rate-native', state: '工具执行', tps: 41.8 },
    { model: 'qoder/ultimate', project: 'etch', state: '等待首次输出' }
  ] : []
  live.className = runs.length ? 'live on' : 'live'
  live.querySelector('span').textContent = runs.length ? `${runs.length} 个会话运行中` : '无运行中的会话'
  box.hidden = !runs.length
  box.innerHTML = runs.map(r => `<div class="run">
    <div><b>${short(r.model)}</b> <span>· ${r.project}</span></div>
    <span class="state${r.gen ? ' gen' : ''}">${r.state}</span>
    <div class="speed num">${r.tps != null ? `<strong>${fmt(r.tps)}</strong><small>token/s</small>` : ''}</div></div>`).join('')
}

// Kernel-smoothed speed on a regular time grid: Gaussian-weighted geometric mean of nearby turns
// (robust to single outliers). Where no turn lies within 1.5 bandwidths, the line breaks: missing
// speed is never drawn as 0 or bridged across idle time.
const bandwidthMs = () => ({ 1: 4, 24: 40, 168: 240 })[hours] * 60_000
const GRID = 180

// Monotone cubic (Fritsch–Carlson): smooth without overshooting real values.
function smoothPath(pts) {
  const n = pts.length, d = [], m = []
  for (let i = 0; i < n - 1; i++) d.push((pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]))
  m[0] = d[0]; m[n - 1] = d[n - 2]
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue }
    const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i] }
  }
  let path = `M${pts[0][0]},${pts[0][1]}`
  for (let i = 0; i < n - 1; i++) {
    const dx = (pts[i + 1][0] - pts[i][0]) / 3
    path += ` C${pts[i][0] + dx},${pts[i][1] + m[i] * dx} ${pts[i + 1][0] - dx},${pts[i + 1][1] - m[i + 1] * dx} ${pts[i + 1][0]},${pts[i + 1][1]}`
  }
  return path
}

function seriesFor(model, ok, grid, h) {
  const own = ok.filter(t => t.model === model && t.tps > 0)
  const values = grid.map(at => {
    let weight = 0, sum = 0, near = false
    for (const t of own) {
      const d = (t.t - at) / h
      if (Math.abs(d) > 3) continue
      if (Math.abs(d) <= 1.5) near = true
      const w = Math.exp(-d * d / 2)
      weight += w; sum += w * Math.log(t.tps)
    }
    return near ? Math.exp(sum / weight) : null
  })
  const segments = []
  values.forEach((v, i) => {
    if (v == null) return
    if (i === 0 || values[i - 1] == null) segments.push([])
    segments.at(-1).push(i)
  })
  return { m: model, values, segments }
}

function renderChart(ok) {
  const box = document.getElementById('chart')
  if (!ok.length) {
    box.innerHTML = `<div class="empty">${turns.length ? '这个时间范围内没有数据' : '还没有数据'}</div>`
    return
  }
  const h = bandwidthMs()
  const x0 = now - hours * 3600_000
  const grid = Array.from({ length: GRID }, (_, i) => x0 + (now - x0) * i / (GRID - 1))
  const series = [...new Set(ok.map(t => t.model))].map(m => seriesFor(m, ok, grid, h))
  const main = series.find(s => s.m === selected)
  const all = series.flatMap(s => s.values.filter(v => v != null))
  // An isolated fast turn must not flatten every other curve; values above the axis clamp to the top.
  const yMax = Math.max(10, Math.ceil(q(all, .98) * 1.1 / 20) * 20)
  const W = box.clientWidth, H = 300, L = 92, R = 4, T = 14, B = 34
  const x = i => L + i / (GRID - 1) * (W - L - R)
  const y = v => T + (1 - Math.min(v, yMax) / yMax) * (H - T - B)
  const base = y(0)
  const dayLabel = t => new Date(t).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' })
  const timeLabel = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` }
  const xlabel = t => hours > 24 ? dayLabel(t) : timeLabel(t)
  const firstMidnight = new Date(x0).setHours(24, 0, 0, 0)
  const xticks = hours > 24
    ? Array.from({ length: 7 }, (_, i) => new Date(firstMidnight).setDate(new Date(firstMidnight).getDate() + i)).filter(t => t <= now)
    : Array.from({ length: 3 }, (_, i) => x0 + (now - x0) * i / 2)
  const tx = t => L + (t - x0) / (now - x0) * (W - L - R)
  const path = (s, idx) => smoothPath(idx.map(i => [x(i), y(s.values[i])]))
  const area = (s, idx) => `${path(s, idx)} L${x(idx.at(-1))},${base} L${x(idx[0])},${base} Z`
  const dot = (s, i, cls) => `<circle cx="${x(i)}" cy="${y(s.values[i])}" r="${cls === 'main' ? 2.6 : 1.6}" fill="${cls === 'main' ? 'var(--line)' : 'var(--line-muted)'}"/>`
  const others = series.filter(s => s !== main).map(s => s.segments.map(idx => idx.length > 1
    ? `<path class="line other" d="${path(s, idx)}"/>` : dot(s, idx[0], 'other')).join('')).join('')
  const mainSvg = main.segments.map(idx => idx.length > 1
    ? `<path d="${area(main, idx)}" fill="url(#fill)"/><path class="line main" d="${path(main, idx)}"/>` : dot(main, idx[0], 'main')).join('')
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="输出速度曲线">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f1ef" stop-opacity=".13"/><stop offset="1" stop-color="#f1f1ef" stop-opacity=".03"/></linearGradient></defs>
    <g class="axis">${[0, yMax / 2, yMax].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>
      <text x="${L - 14}" y="${y(v) + 4}" text-anchor="end">${v ? `${v} token/s` : '0'}</text>`).join('')}
      ${xticks.map((t, i) => `<text x="${tx(t)}" y="${H - 8}" text-anchor="${hours > 24 ? 'middle' : ['start', 'middle', 'end'][i]}">${xlabel(t)}</text>`).join('')}</g>
    ${others}${mainSvg}
    <line class="cross" y1="${T}" y2="${base}" hidden/><g class="marks"></g>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${base - T}" fill="transparent"/>
  </svg><div class="tip" hidden></div>`
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cross = svg.querySelector('.cross'), marks = svg.querySelector('.marks')
  const hide = () => { tip.hidden = true; cross.setAttribute('hidden', ''); marks.innerHTML = '' }
  svg.addEventListener('mousemove', e => {
    const px = e.clientX - svg.getBoundingClientRect().left
    const i = Math.max(0, Math.min(GRID - 1, Math.round((px - L) / (W - L - R) * (GRID - 1))))
    const hits = series.filter(s => s.values[i] != null).sort((a, b) => (b === main) - (a === main) || b.values[i] - a.values[i])
    if (!hits.length) return hide()
    cross.removeAttribute('hidden'); cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i))
    marks.innerHTML = main.values[i] != null ? `<circle cx="${x(i)}" cy="${y(main.values[i])}" r="4.5" fill="var(--line)" stroke="var(--panel)" stroke-width="2"/>` : ''
    tip.hidden = false
    tip.style.left = Math.min(Math.max(x(i), L + 80), W - 80) + 'px'
    tip.innerHTML = `<div class="tip-t">${hours > 24 ? `${dayLabel(grid[i])} ${timeLabel(grid[i])}` : timeLabel(grid[i])}</div>` + hits.map(s =>
      `<div class="tip-r${s === main ? ' main' : ''}">${short(s.m)}<b class="num">${fmt(s.values[i])}</b></div>`).join('')
  })
  svg.addEventListener('mouseleave', hide)
}

function renderModels(ok) {
  const box = document.getElementById('models')
  const groups = [...new Set(ok.map(t => t.model))].map(m => {
    const v = ok.filter(t => t.model === m).map(t => t.tps)
    return { m, n: v.length, p25: q(v, .25), p50: q(v, .5), p75: q(v, .75) }
  }).sort((a, b) => b.p50 - a.p50)
  if (!groups.length) { box.innerHTML = ''; return }
  const max = Math.max(10, Math.ceil(Math.max(...groups.map(g => g.p75)) / 10) * 10)
  const pct = v => `${Math.min(v, max) / max * 100}%`
  box.innerHTML = groups.map(g => `<button class="mrow" aria-pressed="${g.m === selected}" data-m="${g.m}">
      <b>${short(g.m)}</b>
      <span class="bar"><span class="track"></span>
        <span class="iqr" style="left:${pct(g.p25)};width:calc(${pct(g.p75)} - ${pct(g.p25)})"></span>
        <span class="p50" style="left:${pct(g.p50)}"></span></span>
      <span class="speedv num"><strong>${fmt(g.p50)}</strong><small>token/s</small></span>
      <span class="nv num">${g.n} 轮</span>
    </button>`).join('')
  for (const b of box.querySelectorAll('.mrow')) b.onclick = () => { selected = b.dataset.m; render() }
}

for (const b of document.querySelectorAll('#range button')) b.onclick = () => { hours = +b.dataset.h; render() }
addEventListener('resize', render)
render()
</script>
</body>
</html>
