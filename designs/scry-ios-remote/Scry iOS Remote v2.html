<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Scry Remote · Codex 对齐原型 v2</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { color-scheme: light; --ink: #101112; --muted: #929395; --line: #e5e5e7; --blue: #3884f4; --green: #54b583; --amber: #b76d30; --glass: rgba(250,250,250,.89); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--ink); background: #ededee; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: .36; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button, a { touch-action: manipulation; }
    svg { width: 24px; height: 24px; flex: 0 0 auto; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    p, h1, h2, h3 { margin: 0; }
    .stage { display: grid; place-items: center; min-height: 100dvh; padding: 16px; }
    #app { position: relative; width: 390px; height: min(844px, calc(100dvh - 32px)); min-height: 450px; overflow: hidden; background: #fff; border-radius: 38px; border: 1px solid #dedee0; box-shadow: 0 18px 64px #0000000a; padding: 24px 0 12px; }
    .screen { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; min-height: 66px; padding: 6px 14px 10px; background: #fff; z-index: 2; }
    .circle, .capsule, .search-bar, .composer, .evidence-chip { border: 1px solid #e1e1e3; background: var(--glass); box-shadow: inset 0 1px 2px #fff, 0 5px 16px #00000004; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .circle { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 44px; padding: 0; border-radius: 50%; }
    .circle svg { width: 26px; height: 26px; }
    .plain-icon { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
    .header-title { min-width: 0; flex: 1; }
    .header-title h1 { font-size: 17px; line-height: 24px; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .home-title { text-align: center; }
    .host-caption, .subtitle { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); font-size: 12px; line-height: 19px; }
    .host-caption { margin: auto; max-width: 100%; padding: 0; justify-content: center; }
    .host-caption span:last-child, .subtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .host-caption svg { width: 15px; height: 15px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .dot.offline { background: #aaa; }
    .dot.attention { background: var(--amber); }
    .capsule { display: flex; border-radius: 28px; padding: 0 3px; }
    .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }
    .home-list { padding: 7px 19px 100px; }
    .section-label { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 620; min-height: 40px; padding: 0; }
    .section-label svg { width: 13px; height: 13px; color: var(--muted); }
    .thread-row { width: 100%; min-height: 51px; padding: 11px 0; display: flex; align-items: center; gap: 9px; text-align: left; font-size: 17px; letter-spacing: -.25px; line-height: 26px; }
    .thread-row .thread-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-row:hover, .context-row:hover { color: #555; }
    .projects { margin-top: 20px; }
    .project-heading { display: flex; align-items: center; gap: 12px; margin-top: 15px; }
    .project-toggle { padding: 0; min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 550; flex: 1; text-align: left; }
    .project-heading .plain-icon { color: var(--muted); }
    .project-threads { padding-left: 35px; }
    .home-dock { position: absolute; inset: auto 0 0; display: flex; align-items: center; gap: 10px; padding: 14px 20px max(22px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #ffffffee 28%); z-index: 3; }
    .search-bar { display: flex; align-items: center; flex: 1; min-width: 0; height: 48px; border-radius: 30px; padding: 0 13px; gap: 9px; }
    .search-bar input { background: none; border: 0; min-width: 0; width: 100%; outline: none; font-size: 17px; }
    input::placeholder, textarea::placeholder { color: #a8a8ad; }
    .blue-circle { background: var(--blue); border-color: #5798f7; box-shadow: inset 0 1px 2px #ffffff55; color: white; width: 48px; height: 48px; flex-basis: 48px; }
    .notice { margin: 0 16px 9px; padding: 9px 11px; font-size: 12px; line-height: 19px; border-radius: 12px; background: #f5f5f5; color: #626264; flex-shrink: 0; }
    .notice.warning { background: #fcf6ed; color: #996126; }
    .notice button { padding: 0; text-decoration: underline; font-size: inherit; color: inherit; min-height: 28px; }
    .new-header { min-height: 62px; }
    .new-body { display: flex; flex-direction: column; padding: 0 24px 10px; }
    .context-list { margin-top: auto; padding-top: 56px; }
    .context-row { display: flex; align-items: center; gap: 13px; min-height: 47px; width: 100%; text-align: left; padding: 0; font-size: 17px; color: #626264; }
    .context-row > svg { width: 21px; height: 21px; color: #909193; }
    .context-row .chevrons { color: #c4c4c6; width: 12px; height: 16px; margin-left: -7px; }
    .compose-footer { padding: 10px 11px max(14px, env(safe-area-inset-bottom)); flex-shrink: 0; }
    .composer { border-radius: 28px; padding: 12px 13px 7px; background: #fcfcfce8; box-shadow: inset 0 3px 7px #ffffff, 0 8px 22px #00000005; }
    .composer textarea { width: 100%; background: transparent; border: 0; outline: none; resize: none; padding: 2px 1px 4px; font-size: 17px; line-height: 25px; min-height: 40px; max-height: 150px; }
    .compose-actions { display: flex; align-items: center; gap: 3px; margin: 0 -4px; }
    .spacer { flex: 1; }
    .shield { color: #bc672e; }
    .send { background: var(--blue); color: #fff; border: 0; width: 36px; height: 36px; flex-basis: 36px; box-shadow: none; }
    .send:disabled { background: #dedee0; color: white; opacity: 1; }
    .send svg { width: 24px; height: 24px; stroke-width: 2.4; }
    .chat-scroll { padding: 6px 16px 24px; font-size: 17px; line-height: 1.65; overflow-wrap: anywhere; }
    .chat-scroll p { margin: 0 0 19px; }
    .chat-scroll h2 { margin: 24px 0 9px; font-size: 17px; font-weight: 650; }
    .chat-scroll ul { margin: 0 0 24px; padding-left: 23px; }
    .chat-scroll li { margin: 4px 0; }
    .inline-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #8c8c92; font-size: .94em; }
    .code-block { background: #f8f8f8; border: 1px solid #e9e9e9; border-radius: 23px; margin: 16px 0 26px; padding: 3px 14px 17px; }
    .code-label { display: flex; align-items: center; justify-content: space-between; min-height: 42px; font-size: 13px; font-weight: 550; }
    .code-block pre { margin: 3px 0 0; white-space: pre-wrap; font-size: 13px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .response-actions { display: flex; align-items: center; gap: 2px; color: #67676a; margin: 8px -6px 0; }
    .response-actions .plain-icon { min-width: 29px; width: 29px; }
    .response-actions svg { width: 18px; height: 18px; }
    .response-actions time { font-size: 12px; margin-left: 9px; }
    .response-actions [aria-pressed="true"] { color: var(--blue); }
    .thread-footer { flex-shrink: 0; padding: 8px 20px max(20px, env(safe-area-inset-bottom)); background: #fafafa; box-shadow: 0 -16px 26px #fafafa; z-index: 1; }
    .evidence { display: flex; gap: 7px; justify-content: center; margin: 0 0 15px; }
    .evidence-chip { display: inline-flex; gap: 7px; align-items: center; min-height: 32px; padding: 4px 12px; border-radius: 22px; font-size: 12px; color: #67676a; }
    .evidence-chip svg { width: 16px; height: 16px; }
    .positive { color: #527f3c; }
    .negative { color: #b95d60; }
    .compact-composer { display: flex; align-items: center; padding: 2px 7px; border-radius: 32px; min-height: 49px; gap: 4px; }
    .compact-composer textarea { flex: 1; min-width: 0; width: auto; min-height: 31px; height: 31px; padding: 3px 0; line-height: 25px; }
    .compact-composer .plain-icon { min-width: 36px; width: 36px; }
    .user-message { margin: 24px 0 10px 34px; padding: 12px 17px; border-radius: 22px; background: #f0f0f0; white-space: pre-wrap; }
    .receipt { text-align: right; font-size: 12px; color: #8a8a8c; margin: 0 3px 20px; }
    .empty { padding: 60px 20px; text-align: center; color: #919194; font-size: 15px; line-height: 1.6; }
    .simple-body { padding: 14px 20px 35px; }
    .list-button { min-height: 54px; display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; padding: 9px 0; font-size: 16px; border-bottom: 1px solid #f0f0f0; }
    .list-button .detail { color: var(--muted); font-size: 13px; margin-left: auto; }
    .list-button small { color: #8a8a8c; font-size: 12px; display: block; margin-top: 3px; }
    .list-button.selected { color: var(--blue); }
    .muted { color: #8b8b8e; font-size: 13px; line-height: 1.6; }
    .fine { font-size: 12px; color: #919194; }
    .group-title { margin: 24px 0 6px; font-weight: 600; font-size: 14px; }
    .diff { background: #f8f8f8; border: 1px solid var(--line); border-radius: 15px; overflow: hidden; margin-top: 20px; font-size: 12px; }
    .diff-title { padding: 13px 12px; word-break: break-all; border-bottom: 1px solid var(--line); }
    .diff pre { margin: 0; padding: 11px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .diff .removed { color: #986067; background: #fceff0; }
    .diff .added { color: #557645; background: #eef5e9; }
    .terminal { padding: 18px; margin-top: 15px; background: #f7f7f8; border-radius: 18px; color: #39393b; font: 12px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    .terminal-form { display: flex; gap: 8px; margin-top: 16px; }
    .terminal-form input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; }
    .text-button { min-height: 44px; padding: 7px 0; color: var(--blue); font-size: 14px; }
    .danger { color: #be4a43; }
    .scrim { position: absolute; inset: 0; background: #00000030; z-index: 20; display: flex; align-items: flex-end; }
    .sheet { width: 100%; max-height: calc(100% - 45px); overflow-y: auto; overscroll-behavior: contain; background: #fff; border-radius: 29px 29px 0 0; padding: 10px 22px max(24px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 35px #0000000b; }
    .grabber { width: 34px; height: 4px; margin: 0 auto 12px; border-radius: 5px; background: #d4d4d6; }
    .sheet-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
    .sheet h2 { flex: 1; font-size: 20px; font-weight: 620; }
    .sheet .close-sheet { width: 30px; height: 30px; flex-basis: 30px; background: #f3f3f4; border: 0; }
    .close-sheet svg { width: 17px; height: 17px; }
    .sheet .muted { margin: 10px 0 18px; }
    .sheet code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .command { padding: 15px; background: #f6f6f7; border-radius: 14px; margin: 12px 0; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 24px; }
    .sheet-actions button { flex: 1; min-height: 46px; border-radius: 24px; background: #f0f0f1; font-size: 15px; font-weight: 550; }
    .sheet-actions .primary { background: #161719; color: #fff; }
    .sheet-actions .danger-fill { background: #b84e45; color: #fff; }
    .toast { position: absolute; z-index: 30; top: 90px; left: 22px; right: 22px; border-radius: 16px; background: #27282cee; color: white; padding: 12px 15px; font-size: 13px; line-height: 1.5; box-shadow: 0 5px 16px #0002; pointer-events: none; }
    .design-tools { position: fixed; top: 20px; left: 20px; z-index: 40; width: 235px; font-size: 12px; color: #6c6c71; }
    .design-tools summary { cursor: pointer; min-height: 30px; }
    .design-tools .panel { margin-top: 10px; padding: 14px; border: 1px solid #ddd; border-radius: 16px; background: #fafafa; }
    .design-tools .routes { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; }
    .design-tools button { border: 1px solid #ddd; background: white; border-radius: 7px; padding: 7px; font-size: 11px; }
    .design-tools label { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
    .design-tools select { width: 135px; font-size: 11px; padding: 6px; }
    .design-tools a { color: inherit; }
    .design-caption { position: fixed; bottom: 18px; left: 20px; font-size: 11px; color: #9b9ba0; line-height: 1.7; }
    @media (max-width: 850px) { .design-tools { width: 170px; top: 8px; left: 8px; } .design-tools:not([open]) { width: auto; background: #f8f8f8dd; border-radius: 8px; padding: 3px 6px; } .design-caption { display: none; } }
    @media (max-width: 520px) {
      body { background: #fff; }
      .stage { padding: 0; }
      #app { width: 100vw; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; padding: env(safe-area-inset-top) 0 0; }
      .design-tools { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <details class="design-tools">
    <summary>Scry iOS · Codex 对齐稿 v2</summary>
    <div class="panel">交互原型 · 全部为模拟数据
      <div class="routes"><button data-page="home">首页</button><button data-page="new">新会话</button><button data-page="chat">会话</button></div>
      <label>状态 <select id="scenario"><option value="online">已连接 · 锁屏醒着</option><option value="offline">离线</option><option value="stale">Hook 指纹变化</option><option value="revoked">设备已撤销</option><option value="empty">空列表</option><option value="long">长标题</option></select></label>
      <p>借鉴三张用户参考图的结构；没有假键盘、语音能力或真实远程调用。撤销后请刷新页面重置示例。</p>
      <p><a href="Scry%20iOS%20Remote.html">查看 v1 历史稿</a></p>
    </div>
  </details>
  <div class="stage"><div id="app" aria-label="Scry iOS 交互原型，模拟数据"></div></div>
  <div class="design-caption">390 × 844 · 中文示例 · needs-review<br>Codex 结构对齐 / Scry 能力与证据语义</div>
  <script>
    (() => {
      'use strict'
      const paths = {
        back: '<path d="m14 5-7 7 7 7"/>', menu: '<path d="M4 7h16M4 16h11"/>',
        more: '<circle cx="5" cy="12" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="19" cy="12" r="1.1" fill="currentColor"/>',
        laptop: '<rect x="4" y="4" width="16" height="13" rx="1.5"/><path d="M2 19h20l-1 1H3z"/>',
        folder: '<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v1M3 7h16a2 2 0 0 1 2 2l-2 10H3L2 9a2 2 0 0 1 1-2z"/>',
        branch: '<circle cx="7" cy="5" r="2"/><circle cx="17" cy="5" r="2"/><circle cx="7" cy="19" r="2"/><path d="M7 7v10M17 7c0 6-10 2-10 7"/>',
        chevrons: '<path d="m7 8 5-5 5 5M7 16l5 5 5-5"/>', down: '<path d="m6 9 6 6 6-6"/>',
        compose: '<path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6M14 5l4-4 4 4-11 11-5 1 1-5z"/>',
        search: '<circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/>', plus: '<path d="M12 4v16M4 12h16"/>',
        shield: '<path d="m12 2 8 4v6c0 5-8 9-8 9s-8-4-8-9V6zM12 7v5M12 16v.1"/>',
        gauge: '<path d="M3 19a10 10 0 1 1 18 0"/><path d="m13 12 4-6"/><circle cx="11" cy="15" r="2.5"/>',
        send: '<path d="M12 20V4m-7 7 7-7 7 7"/>', close: '<path d="m6 6 12 12M18 6 6 18"/>',
        copy: '<rect x="3" y="7" width="13" height="15" rx="3"/><path d="M8 7V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-3"/>',
        like: '<path d="M8 10v11H3V10zM8 10l5-8c3 1 1 7 1 7h5c3 0 2 4 1 6l-2 6H8"/>',
        dislike: '<path d="M8 14V3H3v11zM8 14l5 8c3-1 1-7 1-7h5c3 0 2-4 1-6l-2-6H8"/>',
        agent: '<rect x="3" y="8" width="18" height="12" rx="5"/><path d="M12 4v4M8 12v3M16 12v3"/><circle cx="12" cy="3" r="1"/>',
        terminal: '<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m6 9 3 3-3 3M12 15h5"/>',
        file: '<path d="M14 2H5v20h14V7zm0 0v5h5M8 12h8M8 16h5"/>',
        bell: '<path d="M6 9a6 6 0 0 1 12 0v6l2 3H4l2-3zM10 21h4"/>',
        check: '<path d="m5 12 4 4L19 6"/>', stop: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
        link: '<path d="m9 15 6-6M8 16l-2 2a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 8l2-2a4 4 0 1 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(2 0) scale(.85)"/>'
      }
      const icon = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.file}</svg>`
      const esc = text => String(text).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])
      const btn = (name, action, label, cls = 'plain-icon', disabled = false) => `<button class="${cls}" data-action="${action}" aria-label="${label}" ${disabled ? 'disabled' : ''}>${icon(name)}</button>`
      const tasks = [
        { id: 'checkout', title: '优化结算页加载状态', provider: 'Claude Code', model: 'Opus', status: 'running' },
        { id: 'approval', title: '补充结算页回归测试', provider: 'Claude Code', model: 'Opus', status: 'attention' },
        { id: 'copy', title: '调整空购物车文案', provider: 'Codex', model: 'Mac 上配置的模型', status: 'completed' },
        { id: 'review', title: '审阅组件边界与依赖', provider: 'Codex', model: 'Mac 上配置的模型', status: 'completed' },
        { id: 'mobile', title: '修复移动端页面布局', provider: 'Claude Code', model: 'Opus', status: 'completed' },
        { id: 'notes', title: '整理本周的更新说明', provider: 'Claude Code', model: 'Opus', status: 'completed' }
      ]
      const s = { page: 'home', modal: null, task: 'checkout', host: 'Studio Mac', project: 'storefront', branch: 'main', online: true, revoked: false, approvalChanged: false,
        scenario: 'online', query: '', pinned: true, expanded: true, draft: '', terminalDraft: '', terminalOwner: 'desktop', terminalPending: false,
        stopRequests: {}, replies: {}, reviewed: false, messages: {}, pending: {}, notifications: true, reaction: null, file: 0,
        nextProvider: 'Claude Code', nextModel: 'Opus', fullAccess: true, toast: '' }
      const app = document.querySelector('#app')
      let toastTimer
      let lastModal = null
      let returnFocusAction = null
      const connected = () => s.online && !s.revoked && s.host === 'Studio Mac'
      const task = () => tasks.find(item => item.id === s.task) || tasks[0]
      const title = item => s.scenario === 'long' && item.id === 'checkout' ? '优化结算页加载状态，并检查较长标题在小屏幕和大字号下的截断表现' : item.title
      const statusText = () => s.revoked ? '设备授权已撤销' : connected() ? '锁屏 · 系统醒着' : '离线 · 显示缓存'
      const notice = () => !connected() ? `<div class="notice">${s.revoked ? '设备授权已撤销。重新连接不会恢复权限。' : '离线 · 可以阅读缓存，发送与审批已停用。'}</div>` : ''
      const backHeader = (heading, sub = '') => `<header class="header">${btn('back', 'back', '返回', 'circle')}<div class="header-title"><h1>${esc(heading)}</h1>${sub ? `<div class="subtitle">${esc(sub)}</div>` : ''}</div></header>`
      const row = item => `<button class="thread-row" data-action="thread" data-id="${item.id}"><span class="thread-name">${esc(title(item))}</span>${item.status === 'attention' && !s.replies[item.id] ? '<span class="dot attention" aria-label="项目 Hook 待审批"></span>' : ''}</button>`
      function home() {
        const matches = tasks.filter(item => (item.host || 'Studio Mac') === s.host && (item.project || 'storefront') === s.project && title(item).includes(s.query.trim()))

            const message = s.draft.trim(); const id = `new-${tasks.length}`
            tasks.push({ id, title: message, provider: s.nextProvider, model: s.nextModel, status: 'pending', host: s.host, project: s.project })
            s.messages[id] = [message]; s.pending[id] = true; s.task = id; go('chat'); break
          }
          case 'send': if (connected() && s.draft.trim() && !s.pending[s.task]) { (s.messages[s.task] ||= []).push(s.draft.trim()); s.pending[s.task] = true; s.draft = ''; toast('示例消息已提交，等待主机确认') }; break
          case 'confirm-stop': if (connected() && !s.stopRequests[s.task] && task().status !== 'completed') { s.stopRequests[s.task] = true; s.modal = null }; break
          case 'approve': if (connected() && task().status === 'attention' && !replyPending()) { if (s.approvalChanged && !s.reviewed) s.reviewed = true; else { s.replies[s.task] = 'approve'; s.modal = null } }; break
          case 'reject': if (connected() && task().status === 'attention' && !replyPending()) { s.replies[s.task] = 'reject'; s.modal = null }; break
          case 'select-file': s.file = Number(target.dataset.index); break
          case 'confirm-control': if (connected()) { s.terminalOwner = 'phone'; s.modal = null }; break
          case 'terminal-send': if (connected() && s.terminalOwner === 'phone' && s.terminalDraft.trim() && !s.terminalPending) { s.terminalPending = true; s.terminalDraft = '' }; break
          case 'confirm-revoke': if (connected()) { s.revoked = true; s.modal = null }; break
          case 'notifications': s.notifications = !s.notifications; break
          case 'like': case 'dislike': s.reaction = s.reaction === action ? null : action; break
          case 'copy': toast('复制入口示意 · 原型未访问剪贴板'); break
          default: if (['navigation', 'home-menu', 'thread-menu', 'hosts', 'projects', 'branches', 'workspace', 'attachments', 'controls', 'models', 'permissions', 'agents', 'stop', 'approval', 'take-control', 'conflict', 'machine', 'revoke', 'pair', 'pair-confirm'].includes(action)) s.modal = action
        }
        render()
      })
      document.addEventListener('input', event => {
        const { id, value } = event.target
        if (id === 'search') {
          const start = event.target.selectionStart
          s.query = value; render()
          const input = document.querySelector('#search'); input?.focus(); input?.setSelectionRange(start, start)
        } else if (id === 'composer') {
          s.draft = value
          const send = document.querySelector(s.page === 'new' ? '[data-action="send-new"]' : '[data-action="send"]')
          if (send) send.disabled = !connected() || !value.trim() || (s.page !== 'new' && Boolean(s.pending[s.task]))
        } else if (id === 'terminal-input') {
          s.terminalDraft = value
          const send = document.querySelector('[data-action="terminal-send"]')
          if (send) send.disabled = !connected() || s.terminalOwner !== 'phone' || s.terminalPending || !value.trim()
        }
      })
      document.addEventListener('change', event => {
        if (event.target.id !== 'scenario') return
        s.scenario = event.target.value; s.online = !['offline', 'revoked'].includes(s.scenario)
        if (s.scenario === 'revoked') s.revoked = true
        if (s.scenario === 'stale') { s.approvalChanged = true; s.task = 'approval'; s.reviewed = false; delete s.replies.approval; go('chat'); s.modal = 'approval' }
        render()
      })
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && s.modal) { s.modal = null; render() }
        if (event.key === 'Tab' && s.modal) {
          const elements = [...(app.querySelectorAll?.('.sheet button:not(:disabled), .sheet input:not(:disabled)') || [])]
          if (!elements.length) return
          const first = elements[0]; const last = elements[elements.length - 1]
          if (event.shiftKey && (document.activeElement === first || !elements.includes(document.activeElement))) { event.preventDefault(); last.focus() }
          else if (!event.shiftKey && (document.activeElement === last || !elements.includes(document.activeElement))) { event.preventDefault(); first.focus() }
        }
      })
      const initialPage = window.location?.hash?.slice(1)
      if (['home', 'new', 'chat'].includes(initialPage)) go(initialPage)
      render()
    })()
  </script>
</body>
</html>
