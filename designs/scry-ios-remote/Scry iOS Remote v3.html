<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Scry Remote · 真实运行生命周期 v3</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { color-scheme: light; --ink: #101112; --muted: #929395; --line: #e5e5e7; --blue: #3884f4; --green: #54b583; --amber: #b76d30; --red: #b95d60; --glass: rgba(250,250,250,.89); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--ink); background: #ededee; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: .36; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button, a { touch-action: manipulation; }
    svg { width: 24px; height: 24px; flex: 0 0 auto; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    p, h1, h2, h3 { margin: 0; }
    .stage { display: grid; place-items: center; min-height: 100dvh; padding: 16px; }
    #app { position: relative; width: 390px; height: min(844px, calc(100dvh - 32px)); min-height: 450px; overflow: hidden; background: #fff; border-radius: 38px; border: 1px solid #dedee0; box-shadow: 0 18px 64px #0000000a; padding: 24px 0 12px; }
    .screen { height: 100%; display: flex; flex-direction: column; min-height: 0; }
    .header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; min-height: 66px; padding: 6px 14px 10px; background: #fff; z-index: 2; }
    .circle, .capsule, .search-bar, .composer, .evidence-chip { border: 1px solid #e1e1e3; background: var(--glass); box-shadow: inset 0 1px 2px #fff, 0 5px 16px #00000004; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .circle { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 44px; padding: 0; border-radius: 50%; }
    .circle svg { width: 26px; height: 26px; }
    .plain-icon { min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
    .header-title { min-width: 0; flex: 1; }
    .header-title h1 { font-size: 17px; line-height: 24px; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .home-title { text-align: center; }
    .host-caption, .subtitle { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); font-size: 12px; line-height: 19px; }
    .host-caption { margin: auto; max-width: 100%; padding: 0; justify-content: center; }
    .host-caption span:last-child, .subtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .host-caption svg { width: 15px; height: 15px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .dot.offline { background: #aaa; }
    .dot.attention { background: var(--amber); }
    .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }
    .home-list { padding: 7px 19px 100px; }
    .section-label { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 620; min-height: 40px; padding: 0; }
    .notice { margin: 0 16px 9px; padding: 9px 11px; font-size: 12px; line-height: 19px; border-radius: 12px; background: #f5f5f5; color: #626264; flex-shrink: 0; }
    .notice.warning { background: #fcf6ed; color: #996126; }
    .home-dock { position: absolute; inset: auto 0 0; display: flex; align-items: center; gap: 10px; padding: 14px 20px max(22px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, #ffffffee 28%); z-index: 3; }
    .search-bar { display: flex; align-items: center; flex: 1; min-width: 0; height: 48px; border-radius: 30px; padding: 0 13px; gap: 9px; }
    .search-bar input { background: none; border: 0; min-width: 0; width: 100%; outline: none; font-size: 17px; }
    input::placeholder, textarea::placeholder { color: #a8a8ad; }
    .blue-circle { background: var(--blue); border-color: #5798f7; box-shadow: inset 0 1px 2px #ffffff55; color: white; width: 48px; height: 48px; flex-basis: 48px; }

    /* --- Run rows: each carries its TRUE ledger state, never a fabricated result --- */
    .run-row { width: 100%; display: flex; align-items: center; gap: 11px; padding: 13px 0; text-align: left; border-bottom: 1px solid #f2f2f3; }
    .run-row .run-main { min-width: 0; flex: 1; }
    .run-row .run-title { font-size: 17px; line-height: 23px; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-row .run-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .state-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 550; white-space: nowrap; background: #f2f2f4; color: #6a6a6d; }
    .state-chip .dot { width: 7px; height: 7px; }
    .state-recorded { background: #f0f0f2; color: #6a6a6d; }
    .state-recorded .dot { background: #b6b6bb; }
    .state-dispatched { background: #eef4fe; color: #3a6fbf; }
    .state-dispatched .dot { background: var(--blue); }
    .state-running { background: #eef4fe; color: #2f6bd0; }
    .state-running .dot { background: var(--blue); animation: pulse 1.4s ease-in-out infinite; }
    .state-settled { background: #edf5ea; color: #4d7a3a; }
    .state-settled .dot { background: var(--green); }
    .state-failed { background: #fceff0; color: #ab5157; }
    .state-failed .dot { background: var(--red); }
    .state-cancelled { background: #f0f0f2; color: #77777b; }
    .state-cancelled .dot { background: #9a9a9e; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .state-running .dot { animation: none; } }

    /* --- Run detail: honest lifecycle timeline built ONLY from ledger events --- */
    .run-head { padding: 2px 20px 14px; }
    .run-head h1 { font-size: 22px; line-height: 29px; font-weight: 640; letter-spacing: -.4px; }
    .run-head .run-meta { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .run-head .state-chip { margin-top: 12px; }
    .provenance { margin: 4px 20px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 15px; background: #fafafa; font-size: 12px; line-height: 1.65; color: #6c6c70; }
    .provenance b { color: #48484b; font-weight: 600; }
    .provenance code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; color: #57575a; }
    .timeline { list-style: none; margin: 18px 0 0; padding: 0 20px 30px; }
    .step { position: relative; padding: 0 0 22px 26px; }
    .step::before { content: ''; position: absolute; left: 4px; top: 16px; bottom: -4px; width: 2px; background: #ececee; }
    .step:last-child::before { display: none; }
    .step .marker { position: absolute; left: 0; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #cfcfd3; box-shadow: 0 0 0 3px #fff; }
    .step.done .marker { background: var(--blue); }
    .step.settled .marker { background: var(--green); }
    .step.failed .marker { background: var(--red); }
    .step.current .marker { background: var(--blue); animation: pulse 1.4s ease-in-out infinite; }
    .step .kind { font-size: 15px; font-weight: 570; letter-spacing: -.2px; }
    .step .when { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .step .detail { margin-top: 7px; padding: 8px 11px; background: #f7f7f8; border-radius: 11px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: #55555a; white-space: pre-wrap; overflow-wrap: anywhere; }
    .step .detail .k { color: #9a9a9e; }
    .run-foot { flex-shrink: 0; padding: 10px 18px max(16px, env(safe-area-inset-bottom)); border-top: 1px solid #f0f0f0; }
    .foot-note { color: var(--muted); font-size: 12px; line-height: 1.55; margin-bottom: 10px; }
    .stop-btn { width: 100%; min-height: 46px; border-radius: 24px; background: #f4eff0; color: var(--red); font-size: 15px; font-weight: 550; }

    /* --- New run: compose + host-sourced project picker --- */
    .new-body { display: flex; flex-direction: column; padding: 0 24px 10px; }
    .context-list { margin-top: auto; padding-top: 40px; }
    .context-row { display: flex; align-items: center; gap: 13px; min-height: 47px; width: 100%; text-align: left; padding: 0; font-size: 17px; color: #626264; }
    .context-row > svg { width: 21px; height: 21px; color: #909193; }
    .context-row .val { color: var(--ink); }
    .context-row .val.unset { color: var(--red); }
    .context-row .chevrons { color: #c4c4c6; width: 12px; height: 16px; margin-left: auto; }
    .compose-footer { padding: 10px 11px max(14px, env(safe-area-inset-bottom)); flex-shrink: 0; }
    .composer { border-radius: 28px; padding: 12px 13px 7px; background: #fcfcfce8; box-shadow: inset 0 3px 7px #ffffff, 0 8px 22px #00000005; }
    .composer textarea { width: 100%; background: transparent; border: 0; outline: none; resize: none; padding: 2px 1px 4px; font-size: 17px; line-height: 25px; min-height: 40px; max-height: 150px; }
    .compose-actions { display: flex; align-items: center; gap: 3px; margin: 0 -4px; }
    .spacer { flex: 1; }
    .send { background: var(--blue); color: #fff; border: 0; width: 36px; height: 36px; flex-basis: 36px; box-shadow: none; }
    .send:disabled { background: #dedee0; color: white; opacity: 1; }
    .send svg { width: 24px; height: 24px; stroke-width: 2.4; }
    .empty { padding: 54px 26px; text-align: center; color: #919194; font-size: 15px; line-height: 1.65; }
    .empty .fine { font-size: 12px; }
    .muted { color: #8b8b8e; font-size: 13px; line-height: 1.6; }
    .fine { font-size: 12px; color: #919194; }
    .list-button { min-height: 54px; display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; padding: 9px 0; font-size: 16px; border-bottom: 1px solid #f0f0f0; }
    .list-button .path { min-width: 0; overflow-wrap: anywhere; }
    .list-button .detail { color: var(--muted); font-size: 13px; margin-left: auto; }
    .list-button small { color: #8a8a8c; font-size: 12px; display: block; margin-top: 3px; }
    .list-button.selected { color: var(--blue); }
    .spinner { width: 18px; height: 18px; border: 2px solid #dcdce0; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 20px 0; }

    .scrim { position: absolute; inset: 0; background: #00000030; z-index: 20; display: flex; align-items: flex-end; }
    .sheet { width: 100%; max-height: calc(100% - 45px); overflow-y: auto; overscroll-behavior: contain; background: #fff; border-radius: 29px 29px 0 0; padding: 10px 22px max(24px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 35px #0000000b; }
    .grabber { width: 34px; height: 4px; margin: 0 auto 12px; border-radius: 5px; background: #d4d4d6; }
    .sheet-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; }
    .sheet h2 { flex: 1; font-size: 20px; font-weight: 620; }
    .sheet .close-sheet { width: 30px; height: 30px; flex-basis: 30px; background: #f3f3f4; border: 0; }
    .close-sheet svg { width: 17px; height: 17px; }
    .sheet .muted { margin: 10px 0 18px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 24px; }
    .sheet-actions button { flex: 1; min-height: 46px; border-radius: 24px; background: #f0f0f1; font-size: 15px; font-weight: 550; }
    .sheet-actions .primary { background: #161719; color: #fff; }
    .sheet-actions .danger-fill { background: #b84e45; color: #fff; }
    .toast { position: absolute; z-index: 30; top: 90px; left: 22px; right: 22px; border-radius: 16px; background: #27282cee; color: white; padding: 12px 15px; font-size: 13px; line-height: 1.5; box-shadow: 0 5px 16px #0002; pointer-events: none; }
    .design-tools { position: fixed; top: 20px; left: 20px; z-index: 40; width: 250px; font-size: 12px; color: #6c6c71; }
    .design-tools summary { cursor: pointer; min-height: 30px; }
    .design-tools .panel { margin-top: 10px; padding: 14px; border: 1px solid #ddd; border-radius: 16px; background: #fafafa; }
    .design-tools .routes { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; }
    .design-tools button { border: 1px solid #ddd; background: white; border-radius: 7px; padding: 7px; font-size: 11px; }
    .design-tools label { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
    .design-tools select { width: 150px; font-size: 11px; padding: 6px; }
    .design-tools a { color: inherit; }
    .design-caption { position: fixed; bottom: 18px; left: 20px; font-size: 11px; color: #9b9ba0; line-height: 1.7; }
    @media (max-width: 850px) { .design-tools { width: 180px; top: 8px; left: 8px; } .design-tools:not([open]) { width: auto; background: #f8f8f8dd; border-radius: 8px; padding: 3px 6px; } .design-caption { display: none; } }
    @media (max-width: 520px) {
      body { background: #fff; }
      .stage { padding: 0; }
      #app { width: 100vw; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; padding: env(safe-area-inset-top) 0 0; }
      .design-tools { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <details class="design-tools">
    <summary>Scry iOS · 真实运行生命周期 v3</summary>
    <div class="panel">交互原型 · 模拟数据，但状态严格对齐真实 ledger
      <div class="routes"><button data-page="home">任务列表</button><button data-page="run">运行详情</button><button data-page="new">新建任务</button></div>
      <label>运行状态 <select id="scenario">
        <option value="running">运行中（progress）</option>
        <option value="recorded">仅已记录（未执行）</option>
        <option value="dispatched">已派发</option>
        <option value="settled">已完成（settled）</option>
        <option value="failed">失败（未授权 cwd）</option>
        <option value="cancelled">已取消</option>
      </select></label>
      <label>项目来源 <select id="projects">
        <option value="loaded">主机返回已授权项目</option>
        <option value="loading">正在读取</option>
        <option value="empty">无已授权项目</option>
      </select></label>
      <p>状态取自主机 ledger（recorded/dispatched/progress/settled/failed/cancelled），不编造结果、token 或文件 diff。项目列表来自主机已授权目录，设备不能自行授权新目录。</p>
      <p><a href="Scry%20iOS%20Remote%20v2.html">← v2（Codex 结构对齐稿）</a></p>
    </div>
  </details>
  <div class="stage"><div id="app" aria-label="Scry iOS 交互原型，模拟数据"></div></div>
  <div class="design-caption">390 × 844 · 中文示例 · needs-review<br>真实 ledger 生命周期 / 诚实证据语义</div>
  <script>
    (() => {
      'use strict'
      const paths = {
        back: '<path d="m14 5-7 7 7 7"/>', menu: '<path d="M4 7h16M4 16h11"/>',
        more: '<circle cx="5" cy="12" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="19" cy="12" r="1.1" fill="currentColor"/>',
        laptop: '<rect x="4" y="4" width="16" height="13" rx="1.5"/><path d="M2 19h20l-1 1H3z"/>',
        folder: '<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v1M3 7h16a2 2 0 0 1 2 2l-2 10H3L2 9a2 2 0 0 1 1-2z"/>',
        chevrons: '<path d="m7 8 5-5 5 5M7 16l5 5 5-5"/>', down: '<path d="m6 9 6 6 6-6"/>',
        compose: '<path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6M14 5l4-4 4 4-11 11-5 1 1-5z"/>',
        search: '<circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/>', plus: '<path d="M12 4v16M4 12h16"/>',
        shield: '<path d="m12 2 8 4v6c0 5-8 9-8 9s-8-4-8-9V6zM12 7v5M12 16v.1"/>',
        gauge: '<path d="M3 19a10 10 0 1 1 18 0"/><path d="m13 12 4-6"/><circle cx="11" cy="15" r="2.5"/>',
        send: '<path d="M12 20V4m-7 7 7-7 7 7"/>', close: '<path d="m6 6 12 12M18 6 6 18"/>',
        agent: '<rect x="3" y="8" width="18" height="12" rx="5"/><path d="M12 4v4M8 12v3M16 12v3"/><circle cx="12" cy="3" r="1"/>',
        check: '<path d="m5 12 4 4L19 6"/>', clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'
      }
      const icon = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.check}</svg>`
      const esc = text => String(text).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])
      const btn = (name, action, label, cls = 'plain-icon', disabled = false) => `<button class="${cls}" data-action="${action}" aria-label="${label}" ${disabled ? 'disabled' : ''}>${icon(name)}</button>`

      // Honest state vocabulary, one per RunLifecycle. Copy makes the recorded !=
      // executed distinction explicit and never implies success we can't prove.
      const STATE = {
        recorded: { cls: 'state-recorded', label: '已记录 · 未执行' },
        dispatched: { cls: 'state-dispatched', label: '已派发' },
        running: { cls: 'state-running', label: '运行中' },
        settled: { cls: 'state-settled', label: '已完成' },
        failed: { cls: 'state-failed', label: '失败' },
        cancelled: { cls: 'state-cancelled', label: '已取消' }
      }
      const chip = state => `<span class="state-chip ${STATE[state].cls}"><span class="dot"></span>${STATE[state].label}</span>`

      // Each run's timeline is built ONLY from real ledger events. Progress markers
      // mirror the host binding's truthful non-secret markers (correlation, bound,
      // started, session, result). No fabricated token/cost/diff evidence.
      const ledgerFor = scenario => {
        const base = [
          { kind: 'intent_recorded', at: '16:24:02', body: null },
        ]
        if (scenario === 'recorded') return { state: 'recorded', events: base }
        const dispatched = [...base, { kind: 'run_dispatched', at: '16:24:02', body: null }]
        if (scenario === 'dispatched') return { state: 'dispatched', events: dispatched }
        if (scenario === 'failed') return { state: 'failed', events: [...dispatched, { kind: 'run_failed', at: '16:24:03', body: { code: 'invalid_target' } }] }
        const progress = [...dispatched,
          { kind: 'run_progress', at: '16:24:03', body: { marker: 'bound', scryRunId: '5f3a…c1d' } },
          { kind: 'run_progress', at: '16:24:04', body: { marker: 'started' } },
          { kind: 'run_progress', at: '16:24:06', body: { marker: 'session', externalSessionId: 'sess_9b2f' } }
        ]
        if (scenario === 'running') return { state: 'running', events: progress }
        if (scenario === 'cancelled') return { state: 'cancelled', events: [...progress, { kind: 'run_cancelled', at: '16:24:40', body: null }] }
        return { state: 'settled', events: [...progress,
          { kind: 'run_progress', at: '16:25:11', body: { marker: 'result', isError: false } },
          { kind: 'run_settled', at: '16:25:11', body: null }
        ] }
      }
      const KIND_LABEL = {
        intent_recorded: '意图已记录', run_dispatched: '主机已派发', run_progress: '进度',
        run_settled: '已完成', run_failed: '失败', run_cancelled: '已取消'
      }

      const projectsData = {
        loaded: [
          { path: '/Projects/storefront', label: 'storefront' },
          { path: '/Projects/docs-site', label: 'docs-site' },
          { path: '/Work/scry', label: 'scry' }
        ],
        loading: null,
        empty: []
      }

      const runs = [
        { id: 'checkout', title: '优化结算页加载状态', provider: 'Claude Code', model: 'Opus', project: 'storefront' },
        { id: 'copy', title: '调整空购物车文案', provider: 'Codex', model: 'Mac 上配置的模型', project: 'storefront' },
        { id: 'notes', title: '整理本周更新说明', provider: 'Claude Code', model: 'Opus', project: 'docs-site' }
      ]
      // Per-run scenario in the list, to show mixed real states honestly.
      const listStates = { checkout: 'running', copy: 'settled', notes: 'failed' }

      const s = { page: 'home', modal: null, run: 'checkout', scenario: 'running', projects: 'loaded',
        host: 'Studio Mac', project: 'storefront', draft: '', chosenProject: '/Projects/storefront',
        provider: 'Claude Code', model: 'Opus', toast: '' }
      const app = document.querySelector('#app')
      let toastTimer, lastModal = null, returnFocusAction = null

      const runById = id => runs.find(r => r.id === id) || runs[0]

      function home() {
        return `<div class="screen"><header class="header">${btn('menu', 'navigation', '导航', 'circle')}<div class="header-title home-title"><h1>任务</h1><button class="host-caption" data-action="hosts"><span class="dot"></span>${icon('laptop')}<span>${esc(s.host)}</span></button></div>${btn('more', 'home-menu', '更多', 'circle')}</header>
          <main class="scroll home-list"><h2 class="section-label">运行</h2>
          ${runs.map(r => {
            const st = listStates[r.id]
            return `<button class="run-row" data-action="open-run" data-id="${r.id}"><div class="run-main"><div class="run-title">${esc(r.title)}</div><div class="run-sub">${esc(r.provider)} · ${esc(r.project)}</div></div>${chip(st)}</button>`
          }).join('')}
          <p class="muted" style="margin:18px 2px">状态取自主机 ledger，逐轮轮询更新。“已记录”不等于已执行；“失败”会显示主机给出的原因码。</p>
          </main>
          <footer class="home-dock"><label class="search-bar">${icon('search')}<input aria-label="搜索任务" placeholder="搜索任务" autocomplete="off"></label>${btn('compose', 'new', '新建任务', 'circle blue-circle')}</footer></div>`
      }

      function runDetail() {
        const r = runById(s.run)
        const { state, events } = ledgerFor(s.scenario)
        const terminal = ['settled', 'failed', 'cancelled'].includes(state)
        const lastIndex = events.length - 1
        const steps = events.map((e, i) => {
          let cls = 'done'
          if (e.kind === 'run_settled') cls = 'settled'
          else if (e.kind === 'run_failed') cls = 'failed'
          else if (i === lastIndex && !terminal) cls = 'current'
          const detail = e.body ? `<div class="detail">${Object.entries(e.body).map(([k, v]) => `<span class="k">${esc(k)}:</span> ${esc(String(v))}`).join('\n')}</div>` : ''
          const label = e.kind === 'run_progress' && e.body?.marker ? `进度 · ${esc(e.body.marker)}` : KIND_LABEL[e.kind]
          return `<li class="step ${cls}"><span class="marker"></span><div class="kind">${label}</div><div class="when">seq ${i + 1} · ${esc(e.at)}</div>${detail}</li>`
        }).join('')
        return `<div class="screen"><header class="header">${btn('back', 'home', '返回任务列表', 'circle')}<div class="header-title"><h1>${esc(r.title)}</h1><div class="subtitle">${esc(r.project)} · ${esc(s.host)}</div></div>${btn('more', 'run-menu', '选项', 'circle')}</header>
          <div class="run-head"><div class="run-meta">${esc(r.provider)} · ${esc(r.model)}</div>${chip(state)}</div>
          <div class="provenance"><b>关联</b> ledgerRunId <code>b3ee…499e</code> ↔ scryRunId <code>5f3a…c1d</code><br>由主机首个进度标记给出。token / 费用 / 文件证据未提供，${terminal ? '不显示为 0' : '运行结束前不显示'}。</div>
          <ul class="scroll timeline">${steps}</ul>
          <footer class="run-foot">${terminal
            ? `<p class="foot-note">${state === 'failed' ? '主机在启动 Provider 前就 fail-closed 拒绝（未授权工作区），执行器从未运行。' : state === 'settled' ? '主机观察到终态成功。文件/用量证据需从主机读取，本页不编造。' : '运行已取消。'}</p>`
            : `<p class="foot-note">运行中 · 每次轮询严格取主机 ledger 游标之后的事件。停止是请求，需主机确认，不等于已结束。</p><button class="stop-btn" data-action="stop">请求停止本轮</button>`}</footer></div>`
      }

      function newRun() {
        const src = projectsData[s.projects]
        const chosen = src && src.find(p => p.path === s.chosenProject)
        return `<div class="screen"><header class="header">${btn('back', 'home', '返回', 'circle')}<div class="header-title"><h1>新建任务</h1></div></header>
          <main class="scroll new-body"><div class="context-list">
            <button class="context-row" data-action="hosts">${icon('laptop')}<span>主机</span><span class="val">${esc(s.host)}</span>${icon('chevrons', 'chevrons')}</button>
            <button class="context-row" data-action="pick-project">${icon('folder')}<span>项目</span>${
              s.projects === 'loading' ? '<span class="val" style="color:var(--muted)">读取中…</span>'
              : chosen ? `<span class="val">${esc(chosen.label)}</span>`
              : '<span class="val unset">需选择</span>'}${icon('chevrons', 'chevrons')}</button>
            <button class="context-row" data-action="controls">${icon('gauge')}<span>Provider</span><span class="val">${esc(s.provider)} · ${esc(s.model)}</span>${icon('chevrons', 'chevrons')}</button>
          </div></main>
          <footer class="compose-footer"><div class="composer"><textarea id="composer" rows="2" aria-label="任务内容" placeholder="要在 ${esc(chosen ? chosen.label : s.host)} 上做什么？">${esc(s.draft)}</textarea><div class="compose-actions">${btn('shield', 'permissions', '权限模式', 'plain-icon shield')}<span class="spacer"></span>${btn('send', 'submit', '提交任务', 'circle send', !chosen || !s.draft.trim())}</div></div></footer></div>`
      }

      function projectSheetBody() {
        const src = projectsData[s.projects]
        if (src === null) return `<div class="loading-row"><span class="spinner"></span>正在从主机读取已授权项目…</div><p class="muted">仅列出 Mac 上已授权的项目目录。</p>`
        if (src.length === 0) return `<div class="empty">该设备没有可用的已授权项目<br><span class="fine">请先在 Mac 的 Scry 里授权项目目录。手机不能自行授权新目录。</span></div>`
        return src.map(p => `<button class="list-button ${p.path === s.chosenProject ? 'selected' : ''}" data-action="choose-project" data-path="${esc(p.path)}"><span class="path">${esc(p.label)}<small>${esc(p.path)}</small></span>${p.path === s.chosenProject ? `<span class="detail">${icon('check')}</span>` : ''}</button>`).join('')
          + `<p class="muted" style="margin-top:14px">只能选择主机已授权的目录；提交到未授权目录会被主机 fail-closed 拒绝。</p>`
      }

      const option = (label, action, detail = '', extra = '') => `<button class="list-button" data-action="${action}" ${extra}><span>${label}</span>${detail ? `<span class="detail">${detail}</span>` : ''}</button>`
      function modalContent() {
        switch (s.modal) {
          case 'navigation': return ['Scry', option('任务', 'home') + option('新建任务', 'new') + '<p class="muted">设计原型 · 模拟数据</p>']
          case 'home-menu': return ['更多', option('新建任务', 'new')]
          case 'run-menu': return ['运行选项', option('新建任务', 'new') + '<p class="muted">文件改动、终端等证据需从主机读取，本稿不编造。</p>']
          case 'hosts': return ['选择主机', option('Studio Mac', 'close-modal', '已连接') + '<p class="muted">主机是执行权威；手机是控制端。</p>']
          case 'pick-project': return ['选择项目', projectSheetBody()]
          case 'controls': return ['Provider 与模型', '<p class="muted">只影响本次新任务。</p>' + ['Claude Code', 'Codex'].map(p => option(p, 'choose-provider', p === s.provider ? '✓' : '', `data-provider="${p}"`)).join('')]
          case 'permissions': return ['权限模式', `<p class="muted">完全访问使用本机用户权限（跳过 Provider 原生命令询问 / 沙箱）；不是 root，也不绕过仓库 MCP / Hook 指纹授权。</p>` + option('默认审批', 'close-modal') + option('完全访问', 'close-modal')]
          case 'stop': return ['请求停止本轮？', '<p class="muted">发送停止请求后需主机确认。请求提交不等于运行已结束。</p><div class="sheet-actions"><button data-action="close-modal">取消</button><button class="danger-fill" data-action="confirm-stop">请求停止</button></div>']
          default: return ['', '']
        }
      }

      function render() {
        const focused = document.activeElement
        const selection = focused?.selectionStart
        const oldScroll = app.querySelector?.('.scroll')?.scrollTop || 0
        const screens = { home, run: runDetail, new: newRun }
        let output = (screens[s.page] || home)()
        if (s.modal) {
          const [heading, body] = modalContent()
          output += `<div class="scrim" data-action="close-modal"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(heading)}"><div class="grabber"></div><div class="sheet-heading"><h2>${esc(heading)}</h2>${btn('close', 'close-modal', '关闭', 'circle close-sheet')}</div>${body}</section></div>`
        }
        if (s.toast) output += `<div class="toast" role="status">${esc(s.toast)}</div>`
        app.innerHTML = output
        const scroll = app.querySelector?.('.scroll')
        if (scroll) scroll.scrollTop = oldScroll
        if (s.modal !== lastModal) {
          if (s.modal) { if (!lastModal) returnFocusAction = focused?.dataset?.action; app.querySelector?.('.sheet button:not(:disabled)')?.focus() }
          else if (returnFocusAction) app.querySelector?.(`[data-action="${returnFocusAction}"]`)?.focus()
        } else if (focused?.id) {
          const replacement = document.getElementById(focused.id); replacement?.focus()
          if (typeof selection === 'number') replacement?.setSelectionRange(selection, selection)
        }
        lastModal = s.modal
      }
      function toast(text) { s.toast = text; window.clearTimeout(toastTimer); toastTimer = window.setTimeout(() => { s.toast = ''; render() }, 2600) }
      function go(page) { if (!['home', 'run', 'new'].includes(page)) return; s.page = page; s.modal = null; s.toast = ''; const sc = app.querySelector?.('.scroll'); if (sc) sc.scrollTop = 0 }

      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action], [data-page]')
        if (!target || target.disabled) return
        if (target.classList.contains('scrim') && event.target !== target) return
        if (target.dataset.page) { go(target.dataset.page); render(); return }
        const action = target.dataset.action
        switch (action) {
          case 'home': case 'new': go(action); break
          case 'back': go('home'); break
          case 'open-run': s.run = target.dataset.id; s.scenario = listStates[s.run] || 'running'; document.getElementById('scenario').value = s.scenario; go('run'); break
          case 'close-modal': s.modal = null; break
          case 'choose-project': s.chosenProject = target.dataset.path; s.modal = null; break
          case 'choose-provider': s.provider = target.dataset.provider; s.model = s.provider === 'Claude Code' ? 'Opus' : 'Mac 上配置的模型'; s.modal = null; break
          case 'submit': {
            const src = projectsData[s.projects]; const chosen = src && src.find(p => p.path === s.chosenProject)
            if (!chosen || !s.draft.trim()) break
            s.draft = ''; go('run'); s.run = 'checkout'; s.scenario = 'recorded'; document.getElementById('scenario').value = 'recorded'
            toast('意图已记录 · 等待主机派发（recorded ≠ 已执行）'); break
          }
          case 'confirm-stop': s.modal = null; toast('停止已请求 · 等待主机确认'); break
          default: if (['navigation', 'home-menu', 'run-menu', 'hosts', 'pick-project', 'controls', 'permissions', 'stop'].includes(action)) s.modal = action
        }
        render()
      })
      document.addEventListener('input', event => {
        if (event.target.id === 'composer') {
          s.draft = event.target.value
          const src = projectsData[s.projects]; const chosen = src && src.find(p => p.path === s.chosenProject)
          const send = document.querySelector('[data-action="submit"]'); if (send) send.disabled = !chosen || !s.draft.trim()
        }
      })
      document.addEventListener('change', event => {
        if (event.target.id === 'scenario') { s.scenario = event.target.value; if (s.page !== 'run') go('run') }
        else if (event.target.id === 'projects') { s.projects = event.target.value; if (s.projects === 'empty') s.chosenProject = ''; else if (s.projects === 'loaded') s.chosenProject = s.chosenProject || '/Projects/storefront' }
        else return
        render()
      })
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && s.modal) { s.modal = null; render() }
        if (event.key === 'Tab' && s.modal) {
          const els = [...(app.querySelectorAll?.('.sheet button:not(:disabled), .sheet input:not(:disabled)') || [])]
          if (!els.length) return
          const first = els[0], last = els[els.length - 1]
          if (event.shiftKey && (document.activeElement === first || !els.includes(document.activeElement))) { event.preventDefault(); last.focus() }
          else if (!event.shiftKey && (document.activeElement === last || !els.includes(document.activeElement))) { event.preventDefault(); first.focus() }
        }
      })
      const initial = window.location?.hash?.slice(1)
      if (['home', 'run', 'new'].includes(initial)) go(initial)
      render()
    })()
  </script>
</body>
</html>
