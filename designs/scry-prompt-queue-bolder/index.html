<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scry · 等待队列 · Bolder 设计稿</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg id="symbols" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
    <symbol id="i-steer" viewBox="0 0 24 24"><path d="M4 4v7a3 3 0 0 0 3 3h13m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="m21 15-5-5L5 19"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 20h18.4z"/><path d="M12 10v4.4M12 17.4v.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="m14 6 4 4"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 4v16m-5-5 5 5 5-5"/></symbol>
  </svg>

  <header class="chrome">
    <div class="chrome-title">
      <h1>Scry · 等待队列</h1>
      <p>Bolder 设计稿 · 四稿对照 · 示例文本与回执均为模拟，未连接 Provider</p>
    </div>
    <div class="chrome-controls">
      <div class="seg" id="variants" role="tablist" aria-label="设计稿"></div>
      <div class="seg" id="scenarios" role="group" aria-label="Steer 状态"></div>
      <div class="seg" role="group" aria-label="输入区宽度">
        <button data-width="960" aria-selected="true">960px</button>
        <button data-width="720" aria-selected="false">720px</button>
      </div>
      <div class="seg" role="group" aria-label="主题">
        <button data-theme="dark" aria-selected="true">深色</button>
        <button data-theme="light" aria-selected="false">浅色</button>
      </div>
      <button class="plain" id="compare" aria-pressed="false">同屏对比</button>
    </div>
  </header>

  <main id="stage" class="stage single" aria-label="等待队列设计预览"></main>
  <footer class="notes" id="notes"></footer>

  <script src="./draft.js"></script>
</body>
</html>
