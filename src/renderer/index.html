<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scry</title>
    <style>
      :root {
        --boot-bg: #0b0d12;
        --boot-panel: #14171e;
        --boot-panel-2: #1a1e27;
        --boot-border: #262b36;
        --boot-fg: #e9edf5;
        --boot-dim: #a9b4c9;
        --boot-accent: #d97757;
        --boot-ok: #4fd1a1;
      }
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--boot-bg);
      }
      body {
        color: var(--boot-fg);
        font: 13.5px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.014) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.014) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      .boot-shell {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr) 340px;
        height: 100%;
        overflow: hidden;
      }
      .boot-side,
      .boot-main,
      .boot-panel {
        min-width: 0;
        border-right: 1px solid var(--boot-border);
      }
      .boot-panel {
        border-right: 0;
        border-left: 1px solid var(--boot-border);
        background: var(--boot-panel);
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 16px;
        font-weight: 700;
      }
      .boot-logo {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 35%, #f6c560 0%, var(--boot-accent) 50%, var(--boot-accent) 100%);
        font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .boot-version {
        margin-left: auto;
        color: var(--boot-dim);
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .boot-line,
      .boot-card,
      .boot-button {
        background: linear-gradient(to bottom, var(--boot-panel-2), var(--boot-panel));
        border: 1px solid var(--boot-border);
        border-radius: 8px;
      }
      .boot-button {
        height: 42px;
        margin: 10px 14px;
      }
      .boot-line {
        height: 36px;
        margin: 12px 14px;
      }
      .boot-section {
        margin: 28px 18px 10px;
        width: 82px;
        height: 10px;
        border-radius: 999px;
        background: rgba(169, 180, 201, 0.28);
      }
      .boot-main {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px;
      }
      .boot-hero {
        width: min(720px, 100%);
      }
      .boot-hero-top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 36px;
      }
      .boot-hero-title {
        font-size: 23px;
        font-weight: 750;
      }
      .boot-kicker {
        color: var(--boot-dim);
        font: 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .boot-headline {
        max-width: 520px;
        font-size: 34px;
        line-height: 1.22;
        font-weight: 760;
        letter-spacing: 0;
      }
      .boot-status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        color: var(--boot-dim);
      }
      .boot-dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--boot-ok);
        box-shadow: 0 0 0 4px rgba(79, 209, 161, 0.12);
      }
      .boot-card {
        height: 120px;
        margin-top: 58px;
        opacity: 0.92;
      }
      .boot-panel-head {
        display: flex;
        gap: 10px;
        padding: 18px;
      }
      .boot-tab {
        height: 42px;
        flex: 1;
        border-radius: 8px;
        border: 1px solid var(--boot-border);
        background: var(--boot-panel-2);
      }
      .boot-panel-body {
        margin: 18px;
        height: 150px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
      }
      .boot-pulse {
        animation: bootPulse 900ms cubic-bezier(0.23, 1, 0.32, 1) infinite alternate;
      }
      @keyframes bootPulse {
        from {
          opacity: 0.58;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <aside class="boot-side">
          <div class="boot-brand">
            <span class="boot-logo">a</span>
            <span>Scry</span>
            <span class="boot-version">0.1.0</span>
          </div>
          <div class="boot-button boot-pulse"></div>
          <div class="boot-line"></div>
          <div class="boot-section"></div>
          <div class="boot-line"></div>
          <div class="boot-line"></div>
        </aside>
        <main class="boot-main">
          <div class="boot-hero">
            <div class="boot-hero-top">
              <span class="boot-logo">a</span>
              <div>
                <div class="boot-hero-title">Scry</div>
                <div class="boot-kicker">v0.1.0</div>
              </div>
            </div>
            <div class="boot-headline">在 app 里驱动本机 AI coding agent，实时看它每一步。</div>
            <div class="boot-status"><span class="boot-dot"></span><span>正在载入会话</span></div>
            <div class="boot-card boot-pulse"></div>
          </div>
        </main>
        <aside class="boot-panel">
          <div class="boot-panel-head">
            <div class="boot-tab boot-pulse"></div>
            <div class="boot-tab"></div>
          </div>
          <div class="boot-panel-body boot-pulse"></div>
        </aside>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
