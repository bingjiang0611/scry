# Scry relay Worker. Official clients self-enroll a random per-host room token.
# RELAY_TOKEN is an optional administrator/legacy credential set out of band:
#   wrangler secret put RELAY_TOKEN
# It must never be bundled into the desktop or iOS app.
name = "scry-relay"
main = "src/worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

# When legacy/admin access is needed, RELAY_TOKEN is supplied as a secret in
# production and via .dev.vars or explicit `vars` for local `wrangler dev`. It is
# intentionally NOT declared here so a deploy never writes a plaintext value.
