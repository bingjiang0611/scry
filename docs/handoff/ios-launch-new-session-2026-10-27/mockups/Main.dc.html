<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>启动即新建会话</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 47px; display: flex; flex-direction: column; background: {{c.main}}; color: {{c.fg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif; overflow: hidden">

<div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px">
<a href="Sidebar.dc.html" aria-label="展开侧栏" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.fg}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3.5"></rect><path d="M9 4.5v15"></path><path d="M5.6 8.5h1.4M5.6 11h1.4"></path></svg>
</a>
<button type="button" aria-label="执行主机：MacBook Pro" style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: {{c.panel2}}; color: {{c.fg}}; font: inherit; font-size: 15px; font-weight: 600">
<span style="width: 7px; height: 7px; border-radius: 4px; background: {{c.ok}}"></span>
<span>MacBook Pro</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{c.dim}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg>
</button>
<a href="Typing.dc.html" aria-label="新建会话" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.fg}}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V12"></path><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg>
</a>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 40px 40px; text-align: center">
<div style="width: 44px; height: 44px; border-radius: 14px; background: {{c.panel2}}; border: 1px solid {{c.border3}}; display: flex; align-items: center; justify-content: center; margin-bottom: 6px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.dim}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17H6.5"></path></svg>
</div>
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.2px">新建会话</h1>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: {{c.dim}}">描述任务，Mac 上的 Agent 会在所选项目里执行</p>
</div>

<div style="padding: 0 12px 6px">
<div style="border-radius: 20px; background: {{c.panel}}; border: 1px solid {{c.border}}; box-shadow: 0 10px 30px {{c.shadow}}; overflow: hidden">
<div style="display: flex; align-items: center; gap: 6px; padding: 8px 10px">
<button type="button" style="display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: {{c.subtle}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 500">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg>
scry</button>
<button type="button" style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: {{c.subtle}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 500">
<span style="width: 7px; height: 7px; border-radius: 4px; background: {{c.claude}}"></span>Claude Code</button>
</div>
<div style="height: 1px; background: {{c.border3}}"></div>
<div style="padding: 13px 14px 8px; font-size: 16px; color: {{c.dim2}}">安排一个任务…</div>
<div style="display: flex; align-items: center; gap: 2px; padding: 0 8px 8px">
<button type="button" aria-label="添加附件与权限" style="width: 40px; height: 40px; border: 0; background: none; color: {{c.dim}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<button type="button" style="height: 32px; padding: 0 8px; border: 0; background: none; color: {{c.dim}}; font: inherit; font-size: 13px">默认审批</button>
<span style="flex-grow: 1"></span>
<button type="button" style="height: 32px; padding: 0 8px; border: 0; background: none; color: {{c.dim}}; font: inherit; font-size: 13px">Opus · 高</button>
<button type="button" aria-label="发送" style="width: 34px; height: 34px; border: 0; border-radius: 17px; background: {{c.sendOff}}; color: {{c.onSendOff}}; display: flex; align-items: center; justify-content: center; margin-left: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
</button>
</div>
</div>
</div>
<div style="height: 28px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
const c = dark ? {
main: '#1C1C1C', panel: '#232323', panel2: '#232323', subtle: 'rgba(255,255,255,0.06)', border: '#333331', border3: '#292927',
fg: '#F1F1EF', dim: '#B5B5AF', dim2: '#8D8D87', ok: '#69CC93', claude: '#D37EC8', shadow: 'rgba(0,0,0,0.28)',
sendOff: '#2B2B2B', onSendOff: '#8D8D87'
} : {
main: '#FFFFFF', panel: '#FFFFFF', panel2: '#F6F6F3', subtle: 'rgba(34,34,32,0.045)', border: '#E4E4DF', border3: '#EEEEEA',
fg: '#222220', dim: '#62625E', dim2: '#7A7A75', ok: '#18794E', claude: '#A15397', shadow: 'rgba(0,0,0,0.08)',
sendOff: '#EEEEEB', onSendOff: '#62625E'
};
return { c };
}
}
</script>
</body>
</html>
