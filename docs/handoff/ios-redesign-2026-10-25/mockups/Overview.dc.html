<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>会话总览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.t-dark{--main:#1c1c1c;--panel:#1c1c1c;--panel2:#232323;--panel3:#2b2b2b;--border:#333331;--border2:#454541;--border3:#292927;--fg:#f1f1ef;--dim:#b5b5af;--sub:#8d8d87;--accent:#5b9cff;--accent-soft:rgb(91 156 255 / 12%);--ok:#69cc93;--warn:#efb958;--bad:#f36c67;--muted-s:rgb(255 255 255 / 4%)}
.scr{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text",system-ui,sans-serif;letter-spacing:-0.004em;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.lbl{font-size:12px;color:var(--sub)}
.kv{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--border3);font-size:14px}
.kv:last-child{border-bottom:0}
.tab{height:40px;border:0;background:transparent;font:500 14.5px/1 inherit;font-family:inherit;cursor:pointer;padding:0;width:56px;transition:color 160ms cubic-bezier(.23,1,.32,1)}
.fill{animation:grow 300ms cubic-bezier(.23,1,.32,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.spin{width:11px;height:11px;box-sizing:border-box;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 900ms linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.fill{animation:none}}
</style>
</helmet>
<div class="scr t-dark" style="width: 390px; height: 844px; box-sizing: border-box; background: rgb(0 0 0 / 60%); color: var(--fg); position: relative; overflow: hidden">
  <div role="dialog" aria-label="会话总览" style="position: absolute; left: 0; right: 0; bottom: 0; top: 62px; background: var(--panel); border-radius: 18px 18px 0 0; border-top: 1px solid var(--border); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 36px; height: 5px; border-radius: 3px; background: var(--border2)"></span></div>
    <div style="display: flex; align-items: center; min-height: 52px; padding: 0 8px 0 20px">
      <div style="flex: 1">
        <div style="font-size: 17px; font-weight: 600">总览</div>
        <div style="font-size: 12px; color: var(--sub); margin-top: 2px">数据来自 Mac 上的会话记录</div>
      </div>
      <a href="Session.dc.html" aria-label="关闭" style="width: 44px; height: 44px; color: var(--dim); display: inline-flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="flex: 1; overflow-y: auto; padding: 8px 20px 34px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 13.5px; color: var(--dim)">上下文占用</span>
        <span style="font-size: 15px; font-weight: 600">26%</span>
      </div>
      <div style="margin-top: 8px; height: 8px; border-radius: 4px; background: var(--panel3); overflow: hidden">
        <div class="fill" style="width: 26%; height: 100%; border-radius: 4px; background: var(--accent); transform-origin: left"></div>
      </div>
      <div style="margin-top: 6px; font-size: 13px"><span>70.5k</span><span style="color: var(--sub)"> / 272.0k</span></div>

      <div style="display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 14px; font-weight: 600">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgb(105 204 147 / 18%)"></span>
        上下文充足，可以继续
      </div>

      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border3)">
        <div style="display: flex; align-items: flex-end; justify-content: space-between">
          <span class="lbl">Token 总量</span>
          <span style="font-size: 28px; font-weight: 600; color: var(--accent); letter-spacing: -0.02em; line-height: 1">1.7M</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px">
          <div style="padding-right: 14px; border-right: 1px solid var(--border3)">
            <div class="lbl">费用</div>
            <div style="margin-top: 4px; font-size: 17px; font-weight: 600">$31.81</div>
          </div>
          <div style="padding-left: 14px">
            <div class="lbl">时长</div>
            <div style="margin-top: 4px; font-size: 17px; font-weight: 600">18 分钟</div>
          </div>
        </div>
      </div>

      <div style="margin-top: 20px; padding: 0 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border3)">
        <div class="kv"><span class="lbl" style="width: 64px">会话 ID</span><span class="mono" style="flex: 1; font-size: 12.5px; color: var(--dim)">019a…c7f2</span>
          <button type="button" style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--muted-s); color: var(--dim); font: 500 12.5px/1 inherit; font-family: inherit; cursor: pointer">复制</button></div>
        <div class="kv"><span class="lbl" style="width: 64px">Provider</span><span>Codex</span></div>
        <div class="kv"><span class="lbl" style="width: 64px">模型</span><span>gpt-5.1-codex · 高</span></div>
        <div class="kv"><span class="lbl" style="width: 64px">工作目录</span><span class="mono" style="font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">~/IdeaProjects/vibecoding/scry</span></div>
      </div>

      <div role="tablist" aria-label="总览数据" style="position: relative; display: flex; gap: 6px; margin-top: 18px; border-bottom: 1px solid var(--border3)">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" role="tab" class="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="color: {{t.color}}">{{t.label}}</button>
        </sc-for>
        <span aria-hidden="true" style="position: absolute; left: 0; bottom: -1px; width: 32px; height: 2px; border-radius: 2px; background: var(--accent); transform: translateX({{underlineX}}); transition: transform 220ms cubic-bezier(.32,.72,0,1)"></span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--border3)">
          <span class="mono" style="font-size: 12px; color: var(--sub); width: 22px">{{r.n}}</span>
          <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px">{{r.title}}</span>
          <sc-if value="{{r.live}}" hint-placeholder-val="{{ false }}"><span class="spin" style="color: var(--accent)" role="status" aria-label="正在运行"></span></sc-if>
          <span style="font-size: 12.5px; color: var(--sub); flex: none">{{r.meta}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    const labels = ['轮次', '文件', '时间线'];
    const data = [
      [{ n: '2', title: '顺便把 Provider 放到行尾，用短标签。', meta: '运行中', live: true }, { n: '1', title: '首页的会话行重复显示项目名…', meta: '1.9k · 42 秒', live: false }],
      [{ n: 'M', title: 'SessionRow.swift', meta: '+12 −7', live: false }, { n: 'M', title: 'ConnectionCopy.swift', meta: '+4 −2', live: false }],
      [{ n: '0:00', title: '第 1 轮开始', meta: '09:12', live: false }, { n: '0:42', title: '第 1 轮完成', meta: '09:13', live: false }, { n: '1:05', title: '第 2 轮开始', meta: '09:13', live: false }]
    ];
    const tab = this.state.tab;
    return {
      tabs: labels.map((label, i) => ({ label, sel: i === tab ? 'true' : 'false', color: i === tab ? 'var(--fg)' : 'var(--sub)', pick: () => this.setState({ tab: i }) })),
      underlineX: (12 + tab * 62) + 'px',
      rows: data[tab]
    };
  }
}
</script>
</body>
</html>
