<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>分析 · 成本与用量</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141416}
a{color:#8ab4ff}a:hover{color:#b3ceff}
button{font-family:inherit}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1180px; background: #141416; color: #e8e8ea; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 14px">

<nav aria-label="侧栏" style="flex: 1 1 240px; max-width: 260px; box-sizing: border-box; background: #18181b; border-right: 1px solid #2a2a2f; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 12px">
<div style="width: 22px; height: 22px; border-custom-gateway: 6px; background: #e8e8ea"></div>
<span style="font-weight: 700; font-size: 15px">Scry</span>
</div>
<a href="#" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-custom-gateway: 8px; color: #c9c9cf; text-decoration: none; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"></path></svg>会话</a>
<a href="Main.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-custom-gateway: 8px; background: #26262c; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"></path></svg>分析</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-custom-gateway: 8px; color: #c9c9cf; text-decoration: none; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>机器</a>
</nav>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 22px; max-width: 1180px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">分析</h1>
<div role="tablist" aria-label="分析视图" style="display: flex; gap: 20px; align-self: stretch; align-items: flex-end">
<a role="tab" aria-selected="false" href="Main.dc.html" style="padding: 8px 0 9px; border-bottom: 2px solid transparent; color: #a1a1aa; font-size: 14px; text-decoration: none">LLM 性能</a>
<a role="tab" aria-selected="true" href="#" style="padding: 8px 0 9px; border-bottom: 2px solid #e8e8ea; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none">成本与用量</a>
</div>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c9c9cf">Agent
<select style="height: 34px; border-custom-gateway: 8px; border: 1px solid #2e2e33; background: #1f1f23; color: #e8e8ea; padding: 0 10px; font-size: 13px; font-family: inherit"><option>全部</option><option>Pi</option><option>Codex</option><option>Qoder</option></select></label>
<div role="group" aria-label="时间范围" style="display: flex; gap: 2px; background: #1d1d21; border: 1px solid #2c2c31; border-custom-gateway: 8px; padding: 2px">
<button style="height: 30px; padding: 0 12px; border-custom-gateway: 6px; border: none; background: transparent; color: #c9c9cf; font-size: 13px; cursor: pointer">24 小时</button>
<button style="height: 30px; padding: 0 12px; border-custom-gateway: 6px; border: none; background: transparent; color: #c9c9cf; font-size: 13px; cursor: pointer">7 天</button>
<button aria-pressed="true" style="height: 30px; padding: 0 12px; border-custom-gateway: 6px; border: none; background: #2c2c33; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer">30 天</button>
<button style="height: 30px; padding: 0 12px; border-custom-gateway: 6px; border: none; background: transparent; color: #c9c9cf; font-size: 13px; cursor: pointer">90 天</button>
</div>
</div>
</header>

<p style="margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.6">金额按 API 价格折算。</p>

<div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<div style="background: #1b1b1f; border: 0.5px solid rgba(255,255,255,0.09); border-custom-gateway: 14px; corner-shape: superellipse(1.25); box-shadow: 0 1px 1px rgba(0,0,0,0.16), 0 3px 3px rgba(0,0,0,0.16), 0 6px 6px rgba(0,0,0,0.14), 0 12px 12px rgba(0,0,0,0.12), inset 0 0.5px 0 rgba(255,255,255,0.05); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #a1a1aa">{{t.label}}</span>
<span style="{{t.valueStyle}}">{{t.value}}</span>
<span style="font-size: 12px; color: #a1a1aa">{{t.sub}}</span>
</div>
</sc-for>
</div>

<section aria-labelledby="daily-h" style="background: #1b1b1f; border: 0.5px solid rgba(255,255,255,0.09); border-custom-gateway: 14px; corner-shape: superellipse(1.25); box-shadow: 0 1px 1px rgba(0,0,0,0.16), 0 3px 3px rgba(0,0,0,0.16), 0 6px 6px rgba(0,0,0,0.14), 0 12px 12px rgba(0,0,0,0.12), inset 0 0.5px 0 rgba(255,255,255,0.05); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<h2 id="daily-h" style="margin: 0; font-size: 15px; font-weight: 600">每日成本</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #c9c9cf">
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; border-top: 2px solid #6ea8ff"></span>Pi</span>
<span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; border-top: 2px solid #e0a46b"></span>Qoder</span>
</div>
<div role="group" aria-label="度量" style="margin-left: auto; display: flex; gap: 2px; background: #18181b; border: 1px solid #2c2c31; border-custom-gateway: 8px; padding: 2px">
<button aria-pressed="true" style="height: 28px; padding: 0 10px; border-custom-gateway: 6px; border: none; background: #2c2c33; color: #ffffff; font-size: 12px; font-weight: 600; cursor: pointer">成本</button>
<button style="height: 28px; padding: 0 10px; border-custom-gateway: 6px; border: none; background: transparent; color: #c9c9cf; font-size: 12px; cursor: pointer">Token</button>
</div>
</div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0 8px">
<div style="display: flex; flex-direction: column; justify-content: space-between; height: 220px; font-size: 11px; color: #8e8e97; text-align: right; font-variant-numeric: tabular-nums" aria-hidden="true"><span>$600</span><span>$300</span><span>$0</span></div>
<div style="position: relative; height: 220px; border-left: 1px solid #2c2c32; border-bottom: 1px solid #2c2c32">
<svg role="img" aria-label="30 天每日成本：Pi 为主，Qoder 很少" viewBox="0 0 600 220" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible">
<line x1="0" y1="110" x2="600" y2="110" stroke="#2a2a30" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"></line>
<path d="{{piArea}}" fill="#6ea8ff" fill-opacity="0.12"></path>
<path d="{{piLine}}" fill="none" stroke="#8ab4ff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
<path d="{{qoderLine}}" fill="none" stroke="#e0a46b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
</svg>
</div>
<div></div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #8e8e97; padding-top: 6px" aria-hidden="true"><span>10月26日</span><span>11月3日</span><span>11月10日</span><span>11月17日</span><span>11月24日</span></div>
</div>
</section>

<section aria-labelledby="agent-h" style="background: #1b1b1f; border: 0.5px solid rgba(255,255,255,0.09); border-custom-gateway: 14px; corner-shape: superellipse(1.25); box-shadow: 0 1px 1px rgba(0,0,0,0.16), 0 3px 3px rgba(0,0,0,0.16), 0 6px 6px rgba(0,0,0,0.14), 0 12px 12px rgba(0,0,0,0.12), inset 0 0.5px 0 rgba(255,255,255,0.05); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px">
<h2 id="agent-h" style="margin: 0; font-size: 15px; font-weight: 600">按 Agent</h2>

</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 13px">
<thead>
<tr style="color: #a1a1aa; text-align: left">
<th scope="col" style="font-weight: 500; padding: 10px 8px 10px 0">Agent · 模型 · 网关</th>
<th scope="col" style="font-weight: 500; padding: 10px 8px; text-align: right">轮次</th>
<th scope="col" style="font-weight: 500; padding: 10px 8px; text-align: right">Token</th>
<th scope="col" style="font-weight: 500; padding: 10px 8px; text-align: right">成本</th>
<th scope="col" style="font-weight: 500; padding: 10px 0 10px 8px; text-align: right">占比</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<tr style="{{r.rowStyle}}">
<td style="{{r.nameCell}}">
<div style="display: flex; align-items: center; gap: 10px">
<sc-if value="{{r.top}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="{{r.dot}}"></span></sc-if>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="{{r.nameStyle}}">{{r.name}}</span>
<span style="font-size: 12px; color: #a1a1aa">{{r.sub}}</span>
</div>
</div>
</td>
<td style="padding: 11px 8px; text-align: right; font-variant-numeric: tabular-nums">{{r.turns}}</td>
<td style="padding: 11px 8px; text-align: right; font-variant-numeric: tabular-nums">{{r.tokens}}</td>
<td style="padding: 11px 8px; text-align: right; font-variant-numeric: tabular-nums"><div style="{{r.costStyle}}">{{r.cost}}</div></td>
<td style="padding: 11px 0 11px 8px; text-align: right; font-variant-numeric: tabular-nums; color: #c9c9cf">{{r.share}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (c) => 'width: 9px; height: 9px; border-custom-gateway: 50%; flex: none; background: ' + c;
    const big = 'font-size: 34px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums';
    const small = 'font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums';
    const badge = (c, bg) => 'display: inline-block; font-size: 12px; padding: 3px 8px; border-custom-gateway: 6px; color: ' + c + '; background: ' + bg;
    const api = badge('#b3ceff', '#1f2a3d'), credits = badge('#f0c27a', '#2a2418'), none = badge('#c9c9cf', '#2a2a30');
    const top = (name, sub, color, turns, tokens, cost, coverage, basis, b, share) => ({ top: true, name, sub, dot: dot(color), turns, tokens, cost, coverage, basis, badgeStyle: b, share,
      rowStyle: 'border-top: 0.5px solid rgba(255,255,255,0.08)', nameCell: 'padding: 14px 8px 8px 0', nameStyle: 'font-weight: 600', costStyle: 'font-size: 15px; font-weight: 600' });
    const child = (name, sub, turns, tokens, cost, coverage, basis, b, priced, share) => ({ top: false, name, sub, dot: '', turns, tokens, cost, coverage, basis, badgeStyle: b, share,
      rowStyle: '', nameCell: 'padding: 6px 8px 6px 28px', nameStyle: 'font-weight: 500; color: #d6d6db',
      costStyle: priced ? 'font-weight: 500' : 'font-size: 12px; color: #f0c27a' });
    const smooth = (pts) => {
      const clamp = (y) => Math.max(0, Math.min(220, y));
      let d = 'M' + pts[0][0] + ',' + pts[0][1];
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = clamp(p1[1] + (p2[1] - p0[1]) / 6);
        const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = clamp(p2[1] - (p3[1] - p1[1]) / 6);
        d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0] + ',' + p2[1];
      }
      return d;
    };
    const pi = [95, 150, 70, 120, 100, 190, 150, 140, 175, 175, 195, 180, 170, 195, 175, 90, 40, 210, 220, 220, 220, 140, 105, 140, 180, 190, 185, 160, 190, 210, 215].map((y, i) => [i * 20, y]);
    const qoder = [218, 218, 218, 217, 217, 217, 216, 214, 212, 212, 214, 214, 213, 212, 214, 218, 218, 219, 220, 220, 220, 218, 216, 216, 217, 217, 218, 218, 218, 218, 218].map((y, i) => [i * 20, y]);
    const piLine = smooth(pi);
    return {
      piLine, piArea: piLine + ' L600,220 L0,220 Z', qoderLine: smooth(qoder),
      tiles: [
        { label: '成本', value: '$7,376', sub: '30 天 · 按 API 价格折算', valueStyle: big },
        { label: '平均每轮', value: '$5.63', sub: '已定价的轮次', valueStyle: small },
        { label: 'Token', value: '182.4 M', sub: '输入 151.0 M · 输出 31.4 M', valueStyle: small },
        { label: '轮次', value: '1,402', sub: '3 个 Agent', valueStyle: small }
      ],
      rows: [
        top('Pi', '', '#6ea8ff', '1,309', '171.2 M', '$7,290', '1,284 / 1,309 轮已定价', 'API 价格', api, '98.8%'),
        child('model-a', 'openai-codex', '1,180', '160.9 M', '$6,912', '全部已定价', 'API 价格', api, true, '93.7%'),
        child('model-b', 'cc-switch', '104', '9.6 M', '$378', '全部已定价', 'API 价格', api, true, '5.1%'),
        child('model-d', 'custom-gateway', '25', '0.7 M', '', '查不到这个模型的价格', '未定价', none, false, ''),
        top('Codex', '', '#5fc8a8', '67', '9.8 M', '', 'Codex 不上报金额，只计 Token', '仅 Token', none, ''),
        top('Qoder', '', '#e0a46b', '26', '1.4 M', '$86.31', '8,631 Credits', 'Credits 折算', credits, '1.2%')
      ]
    };
  }
}
</script>
</body>
</html>
