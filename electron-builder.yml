appId: com.scry.app
productName: Scry
directories:
  output: dist
  buildResources: build

asar: true
# Scry 只提供英文和中文 UI；裁掉 Chromium 其余 locale，避免安装包长期携带约 60 MiB 无用资源。
electronLanguages:
  - en
  - zh_CN
  - zh_TW
# SDK 是 ESM(.mjs) 且运行时要 spawn，从 asar 内 import/spawn 有坑 → 解包成真实文件。
# 体积小(排除平台二进制后只剩 ~7MB 的 .mjs/.d.ts)。
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  # better-sqlite3 是原生模块，.node 二进制必须解包到 asar 外才能 spawn/dlopen 加载
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  # node-pty 提供真实交互式终端；native binding 与 spawn-helper 必须位于真实文件系统。
  - node_modules/node-pty/**

# 只允许生产构建与运行时依赖进入 asar。不能依赖 electron-builder 的默认 files：
# checkout 内被 Git ignore 的 .claude/.local 也可能被默认打包，泄露本机运行日志与会话元数据。
files:
  - out/**
  - "!out/cli/**"
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - fixtures/billing/anthropic-gateway-response.json
  - node_modules/**
  # 选 B：不内嵌 SDK 自带的平台原生 claude 二进制(每个 ~216MB)，app 驱动本机已装的 claude。
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
  # Qoder adapter always passes the user's external qodercli path; the SDK postinstall binary is unused (~95 MiB).
  - "!node_modules/@qoder-ai/qoder-agent-sdk/dist/_bundled/**"

# App 私有 recorder CLI：Provider/Hook 固定调用 Resources/bin/scry，随 App 一起升级。
# wrapper 复用 Electron 的 Node 模式，不再额外捆绑 Node runtime。
extraResources:
  - from: resources/scry-history
    to: scry-history
    filter:
      - pi-history-reader.mjs
  - from: packages/turn-recorder-cli
    to: scry-cli
    filter:
      - package.json
      - dist/**
      - integrations/**
  - from: build/scry-cli
    to: bin/scry

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # dir 目标只出 .app。签名身份由本机 Keychain 或 CSC_* 自动发现；没有可用身份时 builder 会跳过签名。
  # Dock badge 依赖 macOS 通知权限，正式分发必须使用稳定的 Developer ID 身份并公证。
  target:
    - dir

linux:
  # electron-builder 的 Linux 可执行文件名不是产品名。App 私有 CLI 启动器（build/scry-cli）
  # 与产物检查（scripts/check-packaged-app.mjs）都按这个固定文件名定位，不要改名。
  executableName: scry
  category: Development
  # Omarchy/Arch 用 pacman 包装分发；`--dir` 仍产出 linux-unpacked 供本机 smoke 与产物检查。
  target:
    - pacman
  # Electron 用 package.json 的 desktopName 作为 app_id / WM_CLASS。
  # 打开同步后 .desktop 文件名与 StartupWMClass 都用同一个值，桌面环境才能把
  # 运行中的窗口和启动器条目关联起来（否则会显示成无图标的独立窗口）。
  syncDesktopName: true
  # fpm 需要带邮箱的 maintainer（package.json 的 author 只有名字），使用公开的 GitHub 身份。
  maintainer: bingjiang0611 <307659028+bingjiang0611@users.noreply.github.com>
  # electronLanguages 按 locale 文件名精确匹配。Linux 上是 Chromium 的 <lang>-<REGION>.pak，
  # 沿用 mac 的 en/zh_CN/zh_TW 会一个都匹配不上，导致所有 locale 被裁掉。
  electronLanguages:
    - en-US
    - zh-CN
    - zh-TW

# 依赖只能写在目标包里（LinuxConfiguration 不接受 depends）。
pacman:
  # electron-builder 默认的 pacman 依赖表对应旧版 Arch（http-parser、libvpx、re2、minizip 等已不在仓库），
  # 这里只声明当前 Arch 官方仓库存在的运行时依赖。安装依赖仍需在目标机验证后才能当作支持结论。
  depends:
    - gtk3
    - nss
    - libnotify
    - libxtst
    - libxss
    - xdg-utils
    - at-spi2-core
    - libsecret
  # electron-builder 对非 rpm 目标固定把 --description 传成 "${synopsis}\n ${description}"，
  # 换行会写进 .PKGINFO 的 pkgdesc。pacman 按行解析，结果是空描述（pacman -Qi 显示 None）。
  # fpm 参数在文件映射之前追加，重复的 --description 以最后一个为准，所以只覆盖 pacman 目标。
  fpm:
    - --description
    - Scry：本地桌面 app，驱动 AI coding agent 并呈现可检查的执行证据
