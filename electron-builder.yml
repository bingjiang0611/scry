appId: com.scry.app
productName: Scry
directories:
  output: dist
  buildResources: build

asar: true
# Scry 只提供英文和中文 UI；裁掉 Chromium 其余 locale，避免安装包长期携带约 60 MiB 无用资源。
electronLanguages:
  - en
  - zh_CN
  - zh_TW
# SDK 是 ESM(.mjs) 且运行时要 spawn，从 asar 内 import/spawn 有坑 → 解包成真实文件。
# 体积小(排除平台二进制后只剩 ~7MB 的 .mjs/.d.ts)。
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  # better-sqlite3 是原生模块，.node 二进制必须解包到 asar 外才能 spawn/dlopen 加载
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  # node-pty 提供真实交互式终端；native binding 与 spawn-helper 必须位于真实文件系统。
  - node_modules/node-pty/**

# 只允许生产构建与运行时依赖进入 asar。不能依赖 electron-builder 的默认 files：
# checkout 内被 Git ignore 的 .claude/.local 也可能被默认打包，泄露本机运行日志与会话元数据。
files:
  - out/**
  - "!out/cli/**"
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - fixtures/billing/anthropic-gateway-response.json
  - node_modules/**
  # 选 B：不内嵌 SDK 自带的平台原生 claude 二进制(每个 ~216MB)，app 驱动本机已装的 claude。
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
  # Qoder adapter always passes the user's external qodercli path; the SDK postinstall binary is unused (~95 MiB).
  - "!node_modules/@qoder-ai/qoder-agent-sdk/dist/_bundled/**"

# App 私有 recorder CLI：Provider/Hook 固定调用 Resources/bin/scry，随 App 一起升级。
# wrapper 复用 Electron 的 Node 模式，不再额外捆绑 Node runtime。
extraResources:
  - from: packages/turn-recorder-cli
    to: scry-cli
    filter:
      - package.json
      - dist/**
      - integrations/**
  - from: build/scry-cli
    to: bin/scry

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # dir 目标只出 .app。签名身份由本机 Keychain 或 CSC_* 自动发现；没有可用身份时 builder 会跳过签名。
  # Dock badge 依赖 macOS 通知权限，正式分发必须使用稳定的 Developer ID 身份并公证。
  target:
    - dir
